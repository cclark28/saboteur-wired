<script type="text/plain" id="app-src">
const { useState, useEffect } = React;

const SIZES = [
  { w: 1080, h: 1080 },
  { w: 1920, h: 1080 },
  { w: 1350, h: 1080 },
  { w: 1080, h: 1350 },
  { w: 1080, h: 1920 },
];

function randomSize() { return SIZES[Math.floor(Math.random() * SIZES.length)]; }

let NAV_LINKS = [];
let ALL_TAGS = [];
let FOOTER_DATA = null;
let FOOTER_NAV = { home: null, contact: null, section: null, store: null, comics: null, resend: null };
let SECTION_META = [];

const STORE_TABS = [
  { id: 'comics', label: 'Comics' },
  { id: 'prints-and-books', label: 'Books & Zines' },
  { id: 'textures', label: 'Textures' },
  { id: 'original-art', label: 'Original Art' },
  { id: 'clothing', label: 'Apparel' },
];

function isFigureStudiesItem(item) {
  const label = String((item && item.label) || '');
  const slug = String((item && item.sectionSlug) || '');
  return /figure\s*studies/i.test(label) || slug.toLowerCase().replace(/\s+/g, '-') === 'figure-studies';
}

function isInfoMapItem(item) {
  const t = String((item && item.linkType) || '').toLowerCase();
  const label = String((item && item.label) || '');
  const slug = String((item && item.sectionSlug) || '').toLowerCase();
  return t === 'info' || t === 'contact' || /info\s*\/?\s*contact/i.test(label) || /^(info|info-contact|about)$/.test(slug);
}

// Search/filter tags only. Does not change store tab labels.
function displayTagTitle(raw) {
  const t = String(raw == null ? '' : raw).trim();
  if (!t) return '';
  if (/^apperal$/i.test(t)) return 'Apparel';
  if (t.toLowerCase() === 'art') return 'Art';
  return t;
}

function isFigureStudiesLabel(value) {
  const s = String(value || '').toLowerCase().replace(/\s+/g, '-');
  return s === 'figure-studies' || s === 'figurestudies';
}

function isBooksAndZinesLabel(value) {
  const s = String(value || '').toLowerCase().replace(/&/g, 'and').replace(/\s+/g, '-');
  return s === 'books-and-zines' || s === 'prints-and-books';
}

function normalizeAssetTags(rawTags, sections) {
  const tags = (rawTags || [])
    .map((t) => displayTagTitle(typeof t === 'string' ? t : (t && t.title)))
    .filter(Boolean);
  const hasFigure =
    tags.some((t) => isFigureStudiesLabel(t)) ||
    (sections || []).some((s) => isFigureStudiesLabel(s));
  if (hasFigure && !tags.some((t) => isBooksAndZinesLabel(t))) {
    tags.push('Books & Zines');
  }
  return tags;
}

function resolveStoreTab(item) {
  if (!item) return null;
  const slug = String(item.sectionSlug || '').trim().toLowerCase().replace(/\s+/g, '-');
  const label = String(item.label || '').trim().toLowerCase();
  const byId = STORE_TABS.find((c) => c.id === slug);
  if (byId) return byId.id;
  const byLabel = STORE_TABS.find((c) => c.label.toLowerCase() === label);
  if (byLabel) return byLabel.id;
  if (label === 'books' || label === 'zines' || label === 'books and zines' || slug === 'books' || slug === 'zines' || slug === 'books-and-zines') return 'prints-and-books';
  if (label === 'apparel' || label === 'clothes' || slug === 'apparel') return 'clothing';
  return null;
}

// ---------- Path routing (shareable /store + /store/{slug}) ----------
function pathFromView(view) {
  if (!view || !view.page) return '/';
  const p = view.page;
  if (p === 'home') return '/';
  if (p === 'store') {
    const cat = view.storeCategory;
    if (cat && STORE_TABS.some((t) => t.id === cat)) return '/store?tab=' + encodeURIComponent(cat);
    return '/store';
  }
  if (p === 'product') {
    const slug = (view.product && view.product.slug) || view.productSlug || '';
    return slug ? '/store/' + encodeURIComponent(String(slug)) : '/store';
  }
  if (p === 'info' || p === 'about') return '/about';
  if (p === 'resend') return '/resend';
  if (p === 'checkout') return '/checkout';
  if (p === 'order-success') return '/order-success';
  if (p === 'tag' || p === 'item') return '/';
  // section pages
  if (p && typeof p === 'string') return '/' + encodeURIComponent(p);
  return '/';
}

function viewFromPath(pathname, search) {
  // Local file:// previews and non-SPA hosts fall back to home (path routing needs a real host + rewrite)
  try {
    if (typeof location !== 'undefined' && (location.protocol === 'file:' || !pathname || pathname.indexOf('.html') !== -1)) {
      return { page: 'home' };
    }
  } catch (e) {}
  let path = (pathname || '/').split('?')[0];
  path = path.replace(/\/+$/, '') || '/';
  if (path === '/' || path === '') return { page: 'home' };
  if (path === '/store') {
    let storeCategory;
    try {
      const q = search != null ? search : (typeof window !== 'undefined' ? window.location.search : '');
      storeCategory = new URLSearchParams(q).get('tab') || undefined;
    } catch (e) {}
    if (storeCategory && STORE_TABS.some((t) => t.id === storeCategory)) {
      return { page: 'store', storeCategory };
    }
    return { page: 'store' };
  }
  const storeMatch = path.match(/^\/store\/([^/]+)$/);
  if (storeMatch) {
    try {
      return { page: 'product', productSlug: decodeURIComponent(storeMatch[1]) };
    } catch (e) {
      return { page: 'store' };
    }
  }
  if (path === '/about' || path === '/info' || path === '/contact') return { page: 'about' };
  if (path === '/resend') return { page: 'resend' };
  if (path === '/checkout') return { page: 'checkout' };
  if (path === '/order-success') return { page: 'order-success' };
  const seg = path.slice(1);
  if (seg && seg.indexOf('/') === -1) return { page: seg };
  return { page: 'home' };
}

// ---------- Sanity ----------
const SANITY_PROJECT = '6td8xalf';
// Phase 2 — set after Vercel deploy (no trailing slash). Empty = shows setup message.
const CHECKOUT_API_BASE = 'https://saboteur-api.vercel.app';

function saveShopEmail(email, source) {
  const apiBase = String(CHECKOUT_API_BASE || '').replace(/\/$/, '');
  const value = String(email || '').trim();
  if (!apiBase || !value) return Promise.resolve();
  return fetch(apiBase + '/api/subscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: value, source: source || 'shop' }),
  }).then((res) => {
    if (!res.ok) console.error('Email list save failed', res.status);
  }).catch((err) => {
    console.error('Email list save failed', err);
  });
}

const SANITY_DATASET = 'production';
const SANITY_API_DIRECT = `https://${SANITY_PROJECT}.api.sanity.io/v2024-01-01/data/query/${SANITY_DATASET}`;
// Same-origin proxy so Vercel staging/preview can load the live Sanity feed.
// Direct api.sanity.io is blocked there (CORS). /cms is rewritten in vercel.json.
function sanityQueryUrl() {
  try {
    if (typeof location !== 'undefined' && location.protocol !== 'file:') return '/cms';
  } catch (e) {}
  return SANITY_API_DIRECT;
}

async function fetchSanityBundle() {
  const query = encodeURIComponent(`{
    "assets": *[_type == "asset"] | order(coalesce(_updatedAt, _createdAt) desc) {
      _id, title, headline, subhead, body, showOnHome, soldOut,
      mainImage{ asset->{ _id, url, metadata{ dimensions } } },
      mainMedia{ asset->{ _id, url, mimeType, originalFilename } },
      "galleryUrls": gallery[].asset->url,
      "tags": tags[]->{ title, "slug": slug.current },
      "sections": sections[]->{ title, "slug": slug.current }
    },
    "sections": *[_type == "section" && showInNav != false] | order(sortOrder asc) {
      title, "slug": slug.current, sortOrder, comingSoon, isInfoPage, isAbout
    },
    "settings": *[_type == "siteSettings"][0]{
      infoHeadline, infoSubhead, infoParagraphs,
      "infoMediaUrl": infoMedia.asset->url,
      "infoMediaMime": infoMedia.asset->mimeType,
      socialLinks,
      physicalOrdersEnabled,
      physicalOrdersPausedMessage
    },
    "footer": *[_type == "footer"][0]{
      marqueeText,
      logoSubhead, copyright, nextLocation, nextTimezone, localLabel, localTimezone,
      itinerary[]{ _key, startDate, city, label, timezone },
      siteMapLinks[]{ label, linkType, sectionSlug, url },
      socialLinks[]{ label, url }
    },
    "tags": *[_type == "tag"] | order(title asc) { title, "slug": slug.current },
    "ageGate": *[_type == "ageGate"][0]{
      entryMessages,
      enterButtonLabel,
      exitButtonLabel,
      exitMessages,
      exitTitles,
      "exitGifUrls": exitGifs[].asset->url
    },
    "products": *[_type == "product"] | order(coalesce(displayOrder, 999) asc, title asc) {
      _id,
      title,
      "slug": slug.current,
      description,
      priceCents,
      fulfillmentType,
      category,
      enabled,
      requiresAgeConfirm,
      displayOrder,
      stock,
      "digitalFileUrl": select(fulfillmentType == "free_digital" => digitalFileUrl),
      published,
      soldOut,
      comingSoon,
      productDetails,
      variants,
      "imageUrl": images[0].asset->url,
      "imageId": images[0].asset->_id,
      "imageRef": images[0].asset._ref,
      "imageUrls": images[].asset->url
    }
  }`);
  const res = await fetch(`${sanityQueryUrl()}?query=${query}`);
  if (!res.ok) throw new Error('Sanity fetch failed: ' + res.status);
  const json = await res.json();
  return json.result || { assets: [], sections: [], tags: [], settings: null, footer: null, products: [] };
}

function buildImageUrl(mainImage) {
  if (!mainImage || !mainImage.asset) return null;
  if (mainImage.asset.url) return mainImage.asset.url;
  const id = mainImage.asset._id || '';
  if (id.startsWith('image-')) {
    const rest = id.replace(/^image-/, '');
    const lastDash = rest.lastIndexOf('-');
    if (lastDash > 0) {
      const format = rest.slice(lastDash + 1);
      const withoutFormat = rest.slice(0, lastDash);
      return `https://cdn.sanity.io/images/${SANITY_PROJECT}/${SANITY_DATASET}/${withoutFormat}.${format}`;
    }
  }
  return null;
}

function assetToSeries(asset, index) {
  const hasInfo = !!(asset.headline || asset.subhead || asset.body || (asset.tags && asset.tags.length));
  const galleryUrls = (asset.galleryUrls || []).filter(Boolean);

  let imageUrl = buildImageUrl(asset.mainImage);
  let videoUrl = null;

  if (asset.mainMedia && asset.mainMedia.asset && asset.mainMedia.asset.url) {
    const u = asset.mainMedia.asset.url;
    const mime = (asset.mainMedia.asset.mimeType || '').toLowerCase();
    if (mime.startsWith('video/') || /\.(mp4|webm|mov)(\?|$)/i.test(u)) {
      videoUrl = u;
    } else if (!imageUrl) {
      // image or gif stored in mainMedia
      imageUrl = u;
    }
  }
  if (!imageUrl && !videoUrl && galleryUrls[0]) {
    imageUrl = galleryUrls[0];
  }

  let size = randomSize();
  const dims = asset.mainImage && asset.mainImage.asset && asset.mainImage.asset.metadata && asset.mainImage.asset.metadata.dimensions;
  if (dims && dims.width && dims.height) size = { w: dims.width, h: dims.height };

  const sections = (asset.sections || []).map((sec) => {
    if (!sec) return '';
    if (typeof sec === 'string') return sec.toLowerCase().replace(/\s+/g, '-');
    return String(sec.slug || sec.title || '').toLowerCase().replace(/\s+/g, '-');
  }).filter(Boolean);

  const tags = normalizeAssetTags(asset.tags, sections);

  return {
    id: asset._id || ('asset-' + index),
    size,
    hasInfo,
    title: asset.title || null,
    headline: asset.headline || null,
    subhead: asset.subhead || null,
    body: asset.body || null,
    tags,
    sections,
    showOnHome: asset.showOnHome !== false,
    soldOut: !!asset.soldOut,
    gallery: Array.from({ length: Math.max(1, galleryUrls.length || 1) }, () => randomSize()),
    imageUrl,
    videoUrl,
    galleryUrls,
  };
}

function makeSeries(id, opts = {}) {
  // Fallback only used if Sanity returns nothing
  const hasInfo = opts.hasInfo !== undefined ? opts.hasInfo : (id % 3 !== 0);
  const galleryCount = opts.galleryCount !== undefined ? opts.galleryCount : (1 + (id % 4));
  // Give the first several demo items real photos so grain + parallax are visible
  let imageUrl = null;
  if (id % 3 === 0) imageUrl = DEMO_IMG_A;
  else if (id % 3 === 1) imageUrl = DEMO_IMG_B;
  return {
    id,
    size: randomSize(),
    hasInfo,
    headline: hasInfo ? `Study No. ${id + 1}` : null,
    subhead: hasInfo ? 'Street Photography — Tokyo 2024' : null,
    body: hasInfo ? 'Shot on 35mm over three nights near Shinjuku station. Part of an ongoing series on transient light and motion in dense urban space.' : null,
    tags: hasInfo ? ['Street', 'Night', '35mm'] : [],
    gallery: Array.from({ length: galleryCount }, () => randomSize()),
    imageUrl,
    galleryUrls: imageUrl ? [imageUrl] : [],
  };
}

const HOME_ITEMS = Array.from({ length: 14 }, (_, i) => makeSeries(i));
const FIGURE_ITEMS = Array.from({ length: 10 }, (_, i) => makeSeries(i + 20, { hasInfo: i % 2 === 0 }));

function Placeholder({ size, label, imageUrl, videoUrl }) {
  if (!imageUrl && !videoUrl) return null;

  // Wrapper gives us the static grain + desktop parallax target
  const wrap = (media) => (
    <div className="photo-wrap photo-parallax" data-parallax>
      {media}
    </div>
  );

  if (videoUrl) {
    return wrap(
      <video src={videoUrl} muted playsInline autoPlay loop
        style={{ width: '100%', height: 'auto', display: 'block', background: 'transparent' }} />
    );
  }
  if (imageUrl) {
    return wrap(
      <img
        src={imageUrl + (imageUrl.includes('cdn.sanity.io') ? '?w=900&auto=format' : '')}
        alt={label || ''}
        loading="lazy"
        style={{ width: '100%', height: 'auto', display: 'block', background: 'transparent' }}
      />
    );
  }
  return wrap(
    <div style={{ width: '100%', aspectRatio: `${size.w} / ${size.h}`, background: 'var(--color-paper)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 4 }}>
      <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: 11, color: 'var(--color-ink-55)' }}>{size.w} × {size.h}</div>
      {label && <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: 10, color: 'var(--color-ink-55)', opacity: 0.6 }}>{label}</div>}
    </div>
  );
}



function Logo({ size = 160, onClick, forceLight, title = 'Home' }) {
  const [pressed, setPressed] = useState(false);
  const clickable = typeof onClick === 'function';
  const img = (
    <img
      src="/assets/logo.svg"
      alt="Saboteur"
      style={{
        width: size, display: 'block',
        filter: forceLight ? 'none' : 'var(--logo-filter, none)',
        transform: pressed ? 'scale(0.88)' : 'scale(1)', transition: 'transform var(--duration-fast) var(--ease)',
        pointerEvents: 'none',
      }}
    />
  );
  if (!clickable) {
    return (
      <img
        src="/assets/logo.svg"
        alt="Saboteur"
        style={{
          width: size, display: 'block', cursor: 'default',
          filter: forceLight ? 'none' : 'var(--logo-filter, none)',
        }}
      />
    );
  }
  return (
    <a
      href="/"
      aria-label={title === 'Refresh' ? 'Refresh homepage' : 'Saboteur home'}
      title={title}
      onClick={(e) => {
        e.preventDefault();
        setPressed(true);
        setTimeout(() => setPressed(false), 200);
        onClick();
      }}
      style={{ display: 'block', lineHeight: 0, textDecoration: 'none', color: 'inherit', cursor: 'pointer' }}
      onMouseEnter={(e) => { const el = e.currentTarget.querySelector('img'); if (el) el.style.transform = 'scale(1.05)'; }}
      onMouseLeave={(e) => { const el = e.currentTarget.querySelector('img'); if (el) el.style.transform = pressed ? 'scale(0.88)' : 'scale(1)'; }}
    >
      {img}
    </a>
  );
}

/* Saboteur comics icon — orange circle + black cat face. Always brand orange (never filtered). Scales with size prop. */
function SaboteurIcon({ size = 40, onClick }) {
  const [pressed, setPressed] = useState(false);
  const handleClick = onClick ? () => { setPressed(true); setTimeout(() => setPressed(false), 200); onClick(); } : undefined;
  return (
    <svg
      viewBox="0 0 100 100"
      width={size}
      height={size}
      aria-hidden="true"
      onClick={handleClick}
      style={{
        display: 'block',
        flexShrink: 0,
        pointerEvents: onClick ? 'auto' : 'none',
        cursor: onClick ? 'pointer' : 'default',
        transform: pressed ? 'scale(0.88)' : 'scale(1)',
        transition: 'transform var(--duration-fast) var(--ease)',
      }}
      onMouseEnter={onClick ? (e) => { e.currentTarget.style.transform = 'scale(1.05)'; } : undefined}
      onMouseLeave={onClick ? (e) => { e.currentTarget.style.transform = pressed ? 'scale(0.88)' : 'scale(1)'; } : undefined}
    >
      <defs>
        <clipPath id="saboteur-icon-clip">
          <circle cx="50" cy="50" r="50" />
        </clipPath>
      </defs>

function SaboteurComicsLogo({ onClick, height = 40 }) {
  const [pressed, setPressed] = useState(false);
  const [isMobile, setIsMobile] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia('(max-width: 640px)');
    const update = () => setIsMobile(mq.matches);
    update();
    mq.addEventListener('change', update);
    return () => mq.removeEventListener('change', update);
  }, []);
  const handleActivate = onClick || goHeaderStoreComics;
  const handleClick = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    setPressed(true);
    setTimeout(() => setPressed(false), 200);
    handleActivate();
  };
  const inner = isMobile ? (
    <SaboteurIcon size={height} />
  ) : (
    <span
      className="js-comics-lockup"
      style={{
        display: 'inline-flex',
        alignItems: 'center',
        gap: Math.round(height * 0.14),
        height,
        pointerEvents: 'none',
        transform: pressed ? 'scale(0.88)' : 'scale(1)',
        transition: 'transform var(--duration-fast) var(--ease)',
      }}

      <SaboteurIcon size={height} />
      <span style={{
        position: 'relative',
        display: 'flex',
        flexDirection: 'column',
        justifyContent: 'center',
        color: 'var(--color-ink)',
        fontFamily: 'var(--font-family-display)',
        fontWeight: 700,
        letterSpacing: '-0.02em',
        lineHeight: 0.84,
        fontSize: height * 0.46,
        paddingLeft: '0.7em',
      }}>
        <span aria-hidden="true" style={{
          position: 'absolute',
          left: 0,
          top: '-0.04em',
          fontSize: '0.48em',
          fontWeight: 500,
          letterSpacing: 0,
          lineHeight: 1,
        }}>®</span>
        <span>SABOTEUR</span>
        <span>COMICS</span>
      </span>
    </span>
  );
  return (
    <a
      href="/store?tab=comics"
      aria-label="Saboteur Comics store"
      title="Store — Comics"
      onClick={handleClick}
      style={{
        display: 'block',
        lineHeight: 0,
        textDecoration: 'none',
        color: 'inherit',
        cursor: 'pointer',
        flexShrink: 0,
      }}
      onMouseEnter={(e) => { const el = e.currentTarget.querySelector('.js-comics-lockup, svg'); if (el) el.style.transform = 'scale(1.05)'; }}
      onMouseLeave={(e) => { const el = e.currentTarget.querySelector('.js-comics-lockup, svg'); if (el) el.style.transform = pressed ? 'scale(0.88)' : 'scale(1)'; }}
    >
      {inner}
    </a>
  );
}

function FullMenu({ activeSection, onSelect, onClose, onHome, onTag, isLanding = false, links }) {
  const [searchOpen, setSearchOpen] = useState(false);
  const [query, setQuery] = useState('');
  const [exiting, setExiting] = useState(false);
  const matches = ALL_TAGS.filter((t) => t.toLowerCase().includes(query.toLowerCase()));
  const touchStartY = React.useRef(null);
  const exitTimer = React.useRef(null);

  // Gentle close: for landing menu, fade out first; otherwise close immediately.
  const requestClose = React.useCallback(() => {
    if (exiting) return;
    if (!isLanding) {
      onClose();
      return;
    }
    // Respect reduced motion — snap closed
    const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      onClose();
      return;
    }
    setExiting(true);
    exitTimer.current = setTimeout(() => {
      onClose();
    }, 420); // just past the 400ms CSS transition
  }, [exiting, isLanding, onClose]);

  useEffect(() => {
    return () => {
      if (exitTimer.current) clearTimeout(exitTimer.current);
    };
  }, []);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') requestClose();
    };
    window.addEventListener('keydown', onKey);
    // Move focus to the close button area for keyboard users
    const closeBtn = document.querySelector('[aria-label="Close menu"]');
    if (closeBtn) closeBtn.focus();
    return () => window.removeEventListener('keydown', onKey);
  }, [requestClose]);

  // Landing only: scroll / swipe down dismisses the menu and reveals the homepage
  useEffect(() => {
    if (!isLanding || exiting) return;
    const onWheel = (e) => {
      if (e.deltaY > 10) requestClose();
    };
    const onTouchStart = (e) => {
      if (e.touches && e.touches[0]) touchStartY.current = e.touches[0].clientY;
    };
    const onTouchMove = (e) => {
      if (touchStartY.current == null) return;
      const y = e.touches && e.touches[0] ? e.touches[0].clientY : null;
      if (y != null && (touchStartY.current - y) > 40) {
        touchStartY.current = null;
        requestClose();
      }
    };
    window.addEventListener('wheel', onWheel, { passive: true });
    window.addEventListener('touchstart', onTouchStart, { passive: true });
    window.addEventListener('touchmove', onTouchMove, { passive: true });
    return () => {
      window.removeEventListener('wheel', onWheel);
      window.removeEventListener('touchstart', onTouchStart);
      window.removeEventListener('touchmove', onTouchMove);
    };
  }, [isLanding, exiting, requestClose]);

  // RULE: no drop shadows on menu items / search panels — ever.
  // When search opens, show all tags immediately so people can click them.
  // Typing filters the list. Empty only when no tags exist or no match.
  const visibleTags = query.trim()
    ? ALL_TAGS.filter((t) => t.toLowerCase().includes(query.toLowerCase()))
    : ALL_TAGS;

  return (
    <div className={'fullmenu' + (isLanding ? ' is-landing' : '') + (exiting ? ' is-exiting' : '')} style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'var(--color-paper)', display: 'flex', flexDirection: 'column', padding: '16px clamp(16px, 4vw, 48px)' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', minHeight: 40 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 'clamp(24px, 2.8vw, 36px)' }}>
          <Logo size={100} onClick={onHome} />
          <SaboteurComicsLogo height={48} />
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          {/* Search pill + results — relative so the dropdown aligns exactly under the pill */}
          <div style={{ position: 'relative' }}>
            <div className="search-pill" style={{
              display: 'flex',
              alignItems: 'center',
              background: searchOpen ? 'var(--color-paper)' : 'transparent',
              border: searchOpen ? '1px solid var(--color-stroke)' : '1px solid transparent',
              borderRadius: 'var(--radius-sm)',
              padding: searchOpen ? '0 12px 0 10px' : '0',
              height: 40,
              width: searchOpen ? 260 : 40,
              overflow: 'hidden',
              transition: 'width var(--duration-normal) var(--ease), border-color var(--duration-fast) var(--ease), background var(--duration-fast) var(--ease)',
              boxSizing: 'border-box',
              boxShadow: 'none',
            }}>
              <button
                aria-label="Search tags"
                className="icon-btn"
                onClick={() => setSearchOpen((s) => !s)}
                style={{
                  background: 'none', border: 'none', cursor: 'pointer', color: 'var(--color-ink)',
                  padding: 0, flexShrink: 0, width: 40, height: 40,
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                }}
              >
                <img src="/assets/icons/search.svg" width="22" height="22" style={{ width: 22, height: 22, display: 'block', filter: 'var(--logo-filter, none)' }} alt="" />
              </button>
              {searchOpen && (
                <input
                  autoFocus
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="Search tags…"
                  style={{
                    flex: 1,
                    border: 'none',
                    outline: 'none',
                    background: 'transparent',
                    fontFamily: 'var(--font-family-mono)',
                    fontSize: 'var(--font-ui-size)',
                    color: 'var(--color-ink)',
                    minWidth: 0,
                    boxShadow: 'none',
                    WebkitAppearance: 'none',
                    appearance: 'none',
                  }}
                />
              )}
            </div>

            {/* Results panel — flush under the pill. RULE: no drop shadow — border only */}
            {searchOpen && (
              <div className="search-results" style={{
                position: 'absolute',
                top: '100%',
                left: 0,
                width: 260,
                marginTop: 6,
                maxHeight: 280,
                overflowY: 'auto',
                background: 'var(--color-paper)',
                border: '1px solid var(--color-stroke)',
                borderRadius: 'var(--radius-sm)',
                padding: '12px',
                display: 'flex',
                flexWrap: 'wrap',
                gap: 8,
                alignContent: 'flex-start',
                boxShadow: 'none',
                filter: 'none',
                zIndex: 2,
              }}>
                {visibleTags.length === 0 ? (
                  <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: 'var(--font-ui-size)', color: 'var(--color-ink-55)', padding: '4px 0' }}>
                    {query.trim() ? `No tags match “${query}”` : 'No tags yet'}
                  </div>
                ) : (
                  visibleTags.map((t) => (
                    <a
                      key={t}
                      href="#"
                      onClick={(e) => { e.preventDefault(); onTag && onTag(t); }}
                      style={{
                        fontFamily: 'var(--font-family-mono)',
                        fontSize: 'var(--font-ui-size)',
                        color: 'var(--color-ink-55)',
                        border: '1px solid var(--color-stroke)',
                        borderRadius: 'var(--radius-sm)',
                        padding: '8px 12px',
                        textDecoration: 'none',
                        transition: 'color var(--duration-fast) var(--ease), border-color var(--duration-fast) var(--ease)',
                        boxShadow: 'none',
                      }}
                      onMouseEnter={(e) => { e.currentTarget.style.color = 'var(--color-link)'; e.currentTarget.style.borderColor = 'var(--color-link)'; }}
                      onMouseLeave={(e) => { e.currentTarget.style.color = 'var(--color-ink-55)'; e.currentTarget.style.borderColor = 'var(--color-stroke)'; }}
                    >{t}</a>
                  ))
                )}
              </div>
            )}
          </div>

          <button aria-label="Close menu" className="icon-btn" onClick={requestClose} onMouseEnter={(e) => e.currentTarget.style.transform = 'rotate(90deg)'} onMouseLeave={(e) => e.currentTarget.style.transform = 'rotate(0deg)'} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--color-ink)', padding: 0, width: 48, height: 48, transition: 'transform var(--duration-normal) var(--ease)' }}>
            <img src="/assets/icons/close.svg" width="22" height="22" style={{ width: 22, height: 22, display: 'block', filter: 'var(--logo-filter, none)' }} alt="" />
          </button>
        </div>
      </div>

      {/* Big menu links */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 8 }}>
        {(Array.isArray(links) && links.length ? links : NAV_LINKS).map((l) => {
          const key = l.toLowerCase().replace(/\s+/g, '-');
          const isActive = activeSection === key;
          return (
            <a
              key={l}
              href="#"
              className={'fullmenu-link' + (isActive ? ' is-active' : '')}
              onClick={(e) => { e.preventDefault(); onSelect(key); }}
            >
              {l}
            </a>
          );
        })}
      </div>
    </div>
  );
}

function MasonryGrid({ items, onOpen, dense = false }) {
  const isMobile = useIsMobile(700);
  const columns = isMobile
    ? '1'
    : dense
      ? '2 280px'
      : 'clamp(2, 3, 4) clamp(220px, 26vw, 320px)';

  // Fluid equal gap — 24px floor / 32px ceiling on 8px scale. columnGap (H) + marginBottom (V).
  // Container negative margin cancels trailing space so last items sit clean. No padding that can collapse.
  const gap = 'clamp(24px, 2.8vw, 32px)';

  return (
    <div style={{
      columns,
      columnGap: gap,
      marginBottom: 'calc(-1 * clamp(24px, 2.8vw, 32px))',
    }}>
      {items.map((s) => {
        const isStoreItem = (s.sections || []).some((sec) => sec === 'store' || sec === 'shop');
        const showSoldOut = s.soldOut && isStoreItem;
        return (
          <div
            key={s.id}
            onClick={() => onOpen(s)}
            style={{
              breakInside: 'avoid',
              marginBottom: gap,
              cursor: 'pointer',
              overflow: 'hidden',
            }}
          >
            <div style={{ position: 'relative' }}>
              <Placeholder size={s.size} imageUrl={s.imageUrl} videoUrl={s.videoUrl} label={s.title || s.headline || s.subhead || ''} />
              {showSoldOut && (
                <span
                  style={{
                    position: 'absolute',
                    top: 12,
                    right: 12,
                    fontFamily: 'var(--font-family-mono)',
                    fontSize: 11,
                    fontWeight: 500,
                    letterSpacing: '0.04em',
                    textTransform: 'uppercase',
                    padding: '7px 12px',
                    borderRadius: 9999,
                    lineHeight: 1,
                    whiteSpace: 'nowrap',
                    pointerEvents: 'none',
                    userSelect: 'none',
                    zIndex: 2,
                    background: 'var(--color-accent)',
                    color: '#18181B',
                  }}
                >
                  Sold out
                </span>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function useIsMobile(bp) {
  const [m, setM] = useState(window.innerWidth < bp);
  useEffect(() => {
    const onResize = () => setM(window.innerWidth < bp);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [bp]);
  return m;
}

function InfiniteGrid({ baseItems, onOpen }) {
  const [items, setItems] = useState(baseItems);
  const [loading, setLoading] = useState(false);
  const sentinelRef = React.useRef(null);

  // Sync when Sanity data arrives
  useEffect(() => {
    if (baseItems && baseItems.length) {
      setItems(baseItems);
    }
  }, [baseItems]);

  useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !loading && items.length < 200) {
        const hasReal = items.some((it) => it.imageUrl);
        if (hasReal) return; // real Sanity assets — do not invent more or show loading
        setLoading(true);
        setTimeout(() => {
          setItems((prev) => {
            const base = prev.length;
            return prev.concat(Array.from({ length: 8 }, (_, i) => makeSeries('more-' + base + '-' + i)));
          });
          setLoading(false);
        }, 400);
      }
    }, { rootMargin: '800px' });
    io.observe(el);
    return () => io.disconnect();
  }, [loading, items.length]);

  return (
    <div>
      <MasonryGrid items={items} onOpen={onOpen} />
      <div ref={sentinelRef} style={{ height: 1 }} />
      {loading && (
        <div style={{ textAlign: 'center', padding: '32px 0', fontFamily: 'var(--font-family-mono)', fontSize: 'var(--font-ui-size)', color: 'var(--color-ink-55)' }}>Loading more…</div>
      )}
    </div>
  );
}

function resolveItinerary(stops, now) {
  const list = (Array.isArray(stops) ? stops : [])
    .filter((s) => s && s.startDate && s.timezone)
    .slice()
    .sort((a, b) => String(a.startDate).localeCompare(String(b.startDate)));
  if (!list.length) return { current: null, upcoming: null };
  const today = now.toISOString().slice(0, 10);
  let idx = 0;
  for (let i = 0; i < list.length; i++) {
    if (String(list[i].startDate) <= today) idx = i;
  }
  return { current: list[idx], upcoming: list[idx + 1] || null };
}

function formatClock(date, timeZone) {
  try {
    return date.toLocaleTimeString('en-US', {
      timeZone,
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
    });
  } catch (err) {
    return '—';
  }
}

const STORE_CATEGORIES = STORE_TABS.concat([{ id: 'all', label: 'All' }]);

function formatPrice(cents, fulfillmentType) {
  if (fulfillmentType === 'free_digital' || !cents) return 'Free';
  return '$' + (Number(cents) / 100).toFixed(2).replace(/\.00$/, '');
}

function isPhysicalFulfillment(ft) {
  return ft === 'paid_physical' || ft === 'paid_physical_variant';
}

// Auto-pause at local midnight Indianapolis on Aug 19, 2026.
// Sanity switch: false = pause now; true = selling (also the way to resume after the trip); unset = follow this date.
const PHYSICAL_PAUSE_START_MS = Date.parse('2026-08-19T00:00:00-04:00');
const PHYSICAL_PAUSED_COPY = "I'm out of the country, so I can't ship physical goods right now. Digital downloads are still available. Please send me an email for any inquiries.";

function physicalPauseCopy(custom) {
  const c = String(custom || '').trim();
  if (!c) return PHYSICAL_PAUSED_COPY;
  if (/please send me an email/i.test(c)) return c;
  return c.replace(/\s+$/, '') + ' Please send me an email for any inquiries.';
}

function arePhysicalOrdersLive(flag) {
  if (flag === false) return false;
  if (Date.now() >= PHYSICAL_PAUSE_START_MS) return flag === true;
  return true;
}

function isComingSoon(p) {
  return !!(p && (p.comingSoon === true || p.comingSoon === 'true'));
}

/** True when product cannot be purchased (coming soon, sold out, or physical + shipping paused). Digital never affected by travel pause. */
function isProductUnavailable(p, physicalOrdersEnabled) {
  if (!p) return true;
  if (isComingSoon(p)) return true;
  if (p.soldOut === true || p.soldOut === 'true') return true;
  if (isPhysicalFulfillment(p.fulfillmentType)) {
    if (!arePhysicalOrdersLive(physicalOrdersEnabled)) return true;
    if (p.fulfillmentType === 'paid_physical' && Number(p.stock) === 0 && p.stock !== null && p.stock !== undefined && p.stock !== '') return true;
    if (p.fulfillmentType === 'paid_physical_variant' && Array.isArray(p.variants) && p.variants.length > 0 && p.variants.every((v) => Number(v && v.stock) === 0)) return true;
  }
  return false;
}

/** True only when physical orders are paused for this product (not classic sold-out). */
function isShippingPaused(p, physicalOrdersEnabled) {
  return !arePhysicalOrdersLive(physicalOrdersEnabled) && isPhysicalFulfillment(p && p.fulfillmentType);
}

/** Category has products, but none can be bought (sold out, coming soon, or shipping paused). */
function isStoreCategoryLocked(products, catId, physicalOrdersEnabled) {
  if (!catId || catId === 'all') return false;
  const inCat = (products || []).filter((p) => p && p.category === catId);
  if (!inCat.length) return false;
  return inCat.every((p) => p.enabled === false || isProductUnavailable(p, physicalOrdersEnabled));
}

                  letterSpacing: '0.02em', textTransform: 'uppercase', whiteSpace: 'nowrap',
                  borderRadius: 'var(--radius-sm)',
                  transition: 'background var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease)',
                }}
              >{c.label}</button>
            );
          })}
        </div>
        {isEmpty ? (
          <div style={{ padding: '80px 0', textAlign: 'center' }}>
            <p style={{ fontFamily: 'var(--font-family-mono)', fontSize: '13px', color: 'var(--color-ink-55)', margin: '0 0 8px' }}>
              Nothing here yet. Check back soon.
            </p>
            <p style={{ fontFamily: 'var(--font-family-mono)', fontSize: '11px', color: 'var(--color-ink-55)', margin: 0, opacity: 0.7 }}>
              Loaded {(products || []).length} product(s) from Sanity
            </p>
          </div>
        ) : (
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fill, minmax(min(100%, 260px), 1fr))',
            gap: '48px 32px',
          }}>
            {list.map((p) => {
              const img = productImageUrl(p);
              const comingSoon = isComingSoon(p);
              const price = comingSoon ? 'Coming soon' : formatPrice(p.priceCents, p.fulfillmentType);
              const catLabel = (STORE_CATEGORIES.find((c) => c.id === p.category) || {}).label || p.category;
              const unavailable = isProductUnavailable(p, physicalOrdersEnabled);
              const paused = isShippingPaused(p, physicalOrdersEnabled);
              const sold = unavailable && !paused && !comingSoon;
              const badge = comingSoon ? 'Coming soon' : (sold ? 'Sold out' : null);
              return (
                <button
                  key={p._id || p.slug}
                  onClick={() => onOpenProduct && onOpenProduct(p)}
                  style={{
                    background: 'none', border: 'none', padding: 0, cursor: 'pointer', textAlign: 'left',
                    display: 'flex', flexDirection: 'column', gap: 16,
                  }}
                >
                  <div style={{
                    width: '100%', aspectRatio: '4 / 5', background: 'var(--color-paper)',
                    borderRadius: 'var(--radius-sm, 4px)', overflow: 'hidden', position: 'relative',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>
                    {img ? (
                      <img src={img + (img.includes('cdn.sanity.io') ? '?w=800&h=1000&fit=crop&auto=format' : '')} alt={p.title || ''} loading="lazy" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', background: 'transparent', opacity: paused ? 0.4 : 1, transition: 'opacity var(--duration-fast) var(--ease)' }} />
                    ) : (
                      <span style={{ fontFamily: 'var(--font-family-mono)', fontSize: '11px', color: 'var(--color-ink-55)', letterSpacing: '0.04em', textTransform: 'uppercase', padding: 16, textAlign: 'center' }}>
                        {p.title || 'Product'}
                      </span>
                    )}
                    {badge && (
                      <span
                        style={{
                          position: 'absolute',
                          top: 12,
                          right: 12,
                          fontFamily: 'var(--font-family-mono)',
                          fontSize: 11,
                          fontWeight: 500,
                          letterSpacing: '0.04em',
                          textTransform: 'uppercase',
                          padding: '7px 12px',
                          borderRadius: 9999,
                          lineHeight: 1,
                          whiteSpace: 'nowrap',
                          pointerEvents: 'none',
                          userSelect: 'none',
                          zIndex: 2,
                          background: 'var(--color-accent)',
                          color: '#18181B',
                        }}
                      >
                        {badge}
                      </span>
                    )}
                  </div>
                  <div style={{ paddingTop: 2 }}>
                    <div style={{
                      fontFamily: 'var(--font-family-display)', fontWeight: 500, fontSize: '16px', marginBottom: 8, lineHeight: 1.3,
                      color: (unavailable && !comingSoon) ? 'var(--color-ink-55)' : 'var(--color-ink)',
                      textDecoration: sold ? 'line-through' : 'none',
                    }}>{p.title}</div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', gap: 12, alignItems: 'baseline' }}>
                      <span style={{ fontFamily: 'var(--font-family-mono)', fontSize: '11px', color: 'var(--color-ink-55)', letterSpacing: '0.04em', textTransform: 'uppercase' }}>{catLabel}</span>
                      <span style={{
                        fontFamily: 'var(--font-family-mono)',
                        fontSize: '13px',
                        fontVariantNumeric: 'tabular-nums',
                        color: (unavailable && !comingSoon) ? 'var(--color-ink-55)' : 'var(--color-ink)',
                        textDecoration: sold ? 'line-through' : 'none',
                      }}>{price}</span>
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>
      <Footer onContact={onContact} onTag={onTag} onHome={onHome} />
    </div>
  );
}


function ProductDetail({ product, allProducts, physicalOrdersEnabled, physicalOrdersPausedMessage, onMenu, onBack, onHome, onContact, onTag, dark, onToggleDark, cartCount, onCartOpen, cartOpen, menuOpen, onAddToCart, onOpenProduct }) {
  useEffect(() => { window.scrollTo(0, 0); }, [product && product._id]);
  const isMobile = useIsMobile(900);
  const p = product || {};
  const imgs = (p.imageUrls && p.imageUrls.length)
    ? p.imageUrls.filter(Boolean)
    : (productImageUrl(p) ? [productImageUrl(p)] : []);
  // Related: store products only — same category first, then others
  const sameCat = (allProducts || []).filter((x) => x && x._id && x._id !== p._id && x.enabled !== false && x.category && p.category && x.category === p.category);
  const others = (allProducts || []).filter((x) => x && x._id && x._id !== p._id && x.enabled !== false && (!p.category || x.category !== p.category));
  const relatedProducts = sameCat.concat(others).slice(0, 8);
  const comingSoon = isComingSoon(p);
  const price = comingSoon ? 'Coming soon' : formatPrice(p.priceCents, p.fulfillmentType);
  const catLabel = (STORE_CATEGORIES.find((c) => c.id === p.category) || {}).label || p.category || '';
  const isFree = p.fulfillmentType === 'free_digital' || !p.priceCents;
  // Coming soon, sold out, OR physical + shipping paused (digital never affected by the travel switch)
  const isSoldOut = isProductUnavailable(p, physicalOrdersEnabled);
  const shippingPaused = isShippingPaused(p, physicalOrdersEnabled);
  const soldOnly = isSoldOut && !comingSoon && !shippingPaused;
  const details = p.productDetails || {};
  const detailRows = [
    details.format && { label: 'Format', value: details.format },
    details.resolution && { label: 'Resolution', value: details.resolution },
    details.size && { label: 'Size', value: details.size },
    details.material && { label: 'Material', value: details.material },
    details.pages && { label: 'Pages', value: details.pages },
    details.fit && { label: 'Fit / Care', value: details.fit },
  ].filter(Boolean);

  const sizeVariants = Array.isArray(p.variants) ? p.variants.filter((v) => v && v.size) : [];
  const needsSize = p.fulfillmentType === 'paid_physical_variant' || sizeVariants.length > 0;
  const [selectedSize, setSelectedSize] = useState('');
  const sizeOk = !needsSize || !!selectedSize;
  const needsAge = p.requiresAgeConfirm === true;
  const [ageOk, setAgeOk] = useState(false);

  const [dlEmail, setDlEmail] = useState(() => {
    try { return localStorage.getItem('saboteur-download-email') || ''; } catch { return ''; }
  });
  const [dlError, setDlError] = useState('');
  const [dlDone, setDlDone] = useState(false);
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(dlEmail || '').trim());

  const handlePrimary = () => {
    if (isSoldOut || comingSoon) return;
    if (isFree) {
      if (needsAge && !ageOk) {
        setDlError('Confirm you are 18 or older to continue.');
        return;
      }
      const email = String(dlEmail || '').trim();
      if (!emailOk) {
        setDlError('Enter a valid email to download.');
        return;
      }
      setDlError('');
      try {
        localStorage.setItem('saboteur-download-email', email);
        const log = JSON.parse(localStorage.getItem('saboteur-download-log') || '[]');
        log.push({ email: email, productId: p._id, title: p.title, digitalFileUrl: p.digitalFileUrl || null, at: new Date().toISOString() });
        localStorage.setItem('saboteur-download-log', JSON.stringify(log.slice(-50)));
      } catch (e) {}
      saveShopEmail(email, 'download');
      if (p.digitalFileUrl) {
        window.open(p.digitalFileUrl, '_blank', 'noopener,noreferrer');
        setDlDone(true);
      } else {
        setDlError('Download link not set yet.');
      }
      return;
    }
    if (needsAge && !ageOk) {
      setDlError('Confirm you are 18 or older to continue.');
      return;
    }
    if (needsSize && !selectedSize) {
      setDlError('Select a size.');
      return;
    }
    if (onAddToCart) onAddToCart(p, selectedSize || null);
  };

  return (
    <div style={{ minHeight: '100vh', background: 'var(--color-paper)' }}>
      <TopBar onMenu={onMenu} showBack onBack={onBack} onHome={onHome} dark={dark} onToggleDark={onToggleDark} onTag={onTag} cartCount={cartCount} onCartOpen={onCartOpen} hidden={cartOpen || menuOpen} />

      <div style={{
        display: 'flex',
        flexDirection: isMobile ? 'column' : 'row',
        paddingTop: isMobile ? 88 : 100,
        borderBottom: '1px solid var(--color-stroke)',
      }}>
        {/* Images — centered like editorial project view, no grey plate */}
        <div style={{
          flex: 1,
          minWidth: 0,
          padding: isMobile ? '24px 20px 40px' : '32px clamp(24px,5vw,64px) 64px',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
        }}>
          {imgs.length === 0 ? (
            <div style={{
              width: '100%', aspectRatio: '4 / 5', maxWidth: 420,
              background: 'var(--color-paper)', borderRadius: '2px',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: 'var(--font-family-mono)', fontSize: 13, color: 'var(--color-ink-55)',
              letterSpacing: '0.04em', textTransform: 'uppercase',
            }}>{p.title || 'Product'}</div>
          ) : (
            <div style={{
              display: 'flex',
              flexDirection: 'column',
              gap: 'clamp(24px, 2.8vw, 32px)',
              width: '100%',
              maxWidth: 560,
              alignItems: 'center',
            }}>
              {imgs.map((src, i) => (
                <div key={i} style={{
                  width: '100%',
                  display: 'flex',
                  justifyContent: 'center',
                  position: 'relative',
                  maxWidth: 'min(100%, 420px)',
                }}>
                  <img
                    src={src + (src.includes('cdn.sanity.io') ? '?w=1200&auto=format' : '')}
                    alt={p.title ? `${p.title}${i > 0 ? ` — ${i + 1}` : ''}` : ''}
                    loading={i === 0 ? 'eager' : 'lazy'}
                    style={{
                      width: '100%',
                      maxHeight: '72vh',
                      height: 'auto',
                      display: 'block',
                      objectFit: 'contain',
                      background: 'transparent',
                      borderRadius: '2px',
                    }}
                  />
                  {(comingSoon || soldOnly) ? (
                    <span
                      style={{
                        position: 'absolute',
                        top: 12,
                        right: 12,
                        fontFamily: 'var(--font-family-mono)',
                        fontSize: 11,
                        fontWeight: 500,
                        letterSpacing: '0.04em',
                        textTransform: 'uppercase',
                        padding: '7px 12px',
                        borderRadius: 9999,
                        lineHeight: 1,
                        whiteSpace: 'nowrap',
                        pointerEvents: 'none',
                        userSelect: 'none',
                        zIndex: 2,
                        background: 'var(--color-accent)',
                        color: '#18181B',
                      }}
                    >
                      {comingSoon ? 'Coming soon' : 'Sold out'}
                    </span>
                  ) : null}
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Info panel */}
        <div style={{
          width: isMobile ? '100%' : 400,
          flexShrink: 0,
          borderLeft: isMobile ? 'none' : '1px solid var(--color-stroke)',
          borderTop: isMobile ? '1px solid var(--color-stroke)' : 'none',
          padding: isMobile ? '36px 20px 56px' : '40px 48px 64px',
          boxSizing: 'border-box',
          position: isMobile ? 'relative' : 'sticky',
          top: isMobile ? undefined : 100,
          alignSelf: isMobile ? undefined : 'flex-start',
          maxHeight: isMobile ? undefined : 'calc(100vh - 100px)',
          overflowY: isMobile ? undefined : 'auto',
        }}>
          {catLabel ? (
            <div style={{
              fontFamily: 'var(--font-family-mono)', fontSize: '11px', fontWeight: 500,
              letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--color-ink-55)', marginBottom: 16,
            }}>{catLabel}</div>
          ) : null}

          <h1 style={{
            fontFamily: 'var(--font-family-display)', fontWeight: 700,
            fontSize: 'var(--font-h2-size)', margin: '0 0 12px', lineHeight: 1.15, letterSpacing: '-0.02em',
            color: soldOnly ? 'var(--color-ink-55)' : 'var(--color-ink)',
            textDecoration: soldOnly ? 'line-through' : 'none',
          }}>{p.title || 'Untitled'}</h1>

          <div style={{
            fontFamily: 'var(--font-family-mono)', fontSize: '15px', fontWeight: 500,
            color: soldOnly ? 'var(--color-ink-55)' : 'var(--color-ink)',
            marginBottom: 28, fontVariantNumeric: 'tabular-nums',
            textDecoration: soldOnly ? 'line-through' : 'none',
          }}>
            {price}
          </div>

          {p.description ? (
            <p style={{
              fontSize: 'var(--font-body-sm-size)', lineHeight: 1.55,
              color: 'var(--color-ink)', margin: '0 0 32px', maxWidth: 'var(--max-prose)',
            }}>{p.description}</p>
          ) : null}

          {detailRows.length > 0 && (
            <div style={{ marginBottom: 36, display: 'flex', flexDirection: 'column', gap: 12 }}>
              {detailRows.map((row) => (
                <div key={row.label} style={{ display: 'flex', gap: 16, fontFamily: 'var(--font-family-mono)', fontSize: '12px', lineHeight: 1.5 }}>
                  <span style={{ color: 'var(--color-ink-55)', minWidth: 96 }}>{row.label}</span>
                  <span style={{ color: 'var(--color-ink)' }}>{row.value}</span>
                </div>
              ))}
            </div>
          )}

          {details.notes ? (
            <p style={{
              fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-ink-55)',
              margin: '0 0 24px', lineHeight: 1.5,
            }}>{details.notes}</p>
          ) : null}



          {comingSoon ? (
            <p style={{
              fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-ink-55)',
              margin: '0 0 20px', lineHeight: 1.5,
            }}>
              Preview — this item is not available yet.
            </p>
          ) : (p.fulfillmentType === 'paid_physical' || p.fulfillmentType === 'paid_physical_variant') ? (
            <p style={{
              fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-ink-55)',
              margin: '0 0 20px', lineHeight: 1.5,
            }}>
              Physical item — shipping address is collected at checkout when you pay (Stripe). US shipping only.
            </p>
          ) : null}

          {!isSoldOut && needsAge ? (
            <label style={{
              display: 'flex', alignItems: 'flex-start', gap: 12, marginBottom: 28, cursor: 'pointer',
              fontFamily: 'var(--font-family-mono)', fontSize: '13px', color: 'var(--color-ink)', lineHeight: 1.45,
            }}>
              <input
                type="checkbox"
                checked={ageOk}
                onChange={(e) => { setAgeOk(e.target.checked); setDlError(''); }}
                style={{ width: 18, height: 18, marginTop: 2, flexShrink: 0, accentColor: 'var(--color-ink)', cursor: 'pointer' }}
              />
              <span>I confirm I am 18 years of age or older. This product may contain artistic adult content.</span>
            </label>
          ) : null}
          {!isSoldOut && needsSize ? (
            <div style={{ marginBottom: 32 }}>
              <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-ink-55)', marginBottom: 14 }}>Size</div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10 }}>
                {sizeVariants.map((v) => {
                  const sold = Number(v.stock) === 0;
                  const active = selectedSize === v.size;
                  return (
                    <button
                      key={v.size}
                      type="button"
                      disabled={sold}
                      onClick={() => { setSelectedSize(v.size); setDlError(''); }}
                      style={{
                        minWidth: 48, minHeight: 44, padding: '10px 14px',
                        borderRadius: 'var(--radius-sm)',
                        border: active ? '2px solid var(--color-ink)' : '1px solid var(--color-stroke)',
                        background: active ? 'var(--color-ink)' : 'var(--color-paper)',
                        color: sold ? 'var(--color-ink-55)' : (active ? 'var(--color-paper)' : 'var(--color-ink)'),
                        fontFamily: 'var(--font-family-mono)', fontSize: '13px', fontWeight: 500,
                        cursor: sold ? 'not-allowed' : 'pointer',
                        opacity: sold ? 0.45 : 1,
                        textDecoration: sold ? 'line-through' : 'none',
                      }}
                    >{v.size}</button>
                  );
                })}
              </div>
            </div>
          ) : null}

          {isFree && !isSoldOut && (
            <div style={{ marginBottom: 20 }}>
              <label style={{
                display: 'block', fontFamily: 'var(--font-family-mono)', fontSize: '12px',
                color: 'var(--color-ink-55)', marginBottom: 6,
              }}>Email</label>
              <p style={{ fontFamily: 'var(--font-family-mono)', fontSize: '11px', color: 'var(--color-ink-55)', margin: '0 0 8px', lineHeight: 1.4 }}>
                We capture your email to stay in touch. The file stays available here — this is not a lock.
              </p>
              <input
                type="email"
                name="download-email"
                autoComplete="email"
                placeholder="you@domain.com"
                value={dlEmail}
                onChange={(e) => { setDlEmail(e.target.value); setDlError(''); setDlDone(false); }}
                onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); handlePrimary(); } }}
                style={{
                  width: '100%', boxSizing: 'border-box', height: 48, padding: '12px 16px',
                  borderRadius: 'var(--radius-sm)',
                  border: dlError ? '2px solid var(--color-error)' : '1px solid var(--color-stroke)',
                  background: 'var(--color-paper)', color: 'var(--color-ink)',
                  fontFamily: 'var(--font-family-mono)', fontSize: '13px', outline: 'none',
                }}
                onFocus={(e) => { if (!dlError) e.currentTarget.style.border = '2px solid var(--color-ink)'; }}
                onBlur={(e) => { if (!dlError) e.currentTarget.style.border = '1px solid var(--color-stroke)'; }}
              />
              {dlError ? (
                <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-error)', marginTop: 6 }}>{dlError}</div>
              ) : null}
            </div>
          )}

          {shippingPaused && !isFree && !comingSoon ? (
            <PhysicalPauseNotice message={physicalOrdersPausedMessage} compact />
          ) : (
          <button
            onClick={handlePrimary}
            disabled={isSoldOut || comingSoon || (isFree && !emailOk) || (!isFree && needsSize && !sizeOk) || (needsAge && !ageOk)}
            style={{
              width: '100%', minHeight: 48, padding: '14px 28px',
              background: (isSoldOut || comingSoon || (isFree && !emailOk) || (!isFree && needsSize && !sizeOk) || (needsAge && !ageOk)) ? 'var(--color-card)' : 'var(--color-ink)',
              color: (isSoldOut || comingSoon || (isFree && !emailOk) || (!isFree && needsSize && !sizeOk) || (needsAge && !ageOk)) ? 'var(--color-ink-55)' : 'var(--color-paper)',
              border: 'none',
              borderRadius: 'var(--radius-sm)',
              cursor: (isSoldOut || comingSoon || (isFree && !emailOk) || (!isFree && needsSize && !sizeOk) || (needsAge && !ageOk)) ? 'not-allowed' : 'pointer',
              fontFamily: 'var(--font-family-mono)', fontSize: '13px', fontWeight: 500,
              letterSpacing: '0.02em',
              opacity: (isSoldOut || comingSoon || (isFree && !emailOk) || (!isFree && needsSize && !sizeOk) || (needsAge && !ageOk)) ? 0.9 : 1,
              transition: 'background var(--duration-fast) var(--ease), color var(--duration-fast) var(--ease), transform var(--duration-fast) var(--ease)',
            }}
            onMouseEnter={(e) => {
              if (isSoldOut || comingSoon || (isFree && !emailOk) || (!isFree && needsSize && !sizeOk) || (needsAge && !ageOk)) return;
              e.currentTarget.style.background = 'var(--color-accent)';
              e.currentTarget.style.color = '#FFFFFF';
            }}
            onMouseLeave={(e) => {
              if (isSoldOut || comingSoon || (isFree && !emailOk) || (!isFree && needsSize && !sizeOk) || (needsAge && !ageOk)) {
                e.currentTarget.style.background = 'var(--color-card)';
                e.currentTarget.style.color = 'var(--color-ink-55)';
                return;
              }
              e.currentTarget.style.background = 'var(--color-ink)';
              e.currentTarget.style.color = 'var(--color-paper)';
            }}
            onMouseDown={(e) => { if (!(isSoldOut || comingSoon || (isFree && !emailOk) || (!isFree && needsSize && !sizeOk) || (needsAge && !ageOk))) e.currentTarget.style.transform = 'scale(0.98)'; }}
            onMouseUp={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
          >
            {comingSoon
              ? 'Coming soon'
              : isSoldOut
              ? 'Out of stock'
              : (isFree ? (dlDone ? 'Download again' : 'Download') : 'Add to bag')}
          </button>
          )}
          {isFree && dlDone ? (
            <p style={{
              fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-success)',
              margin: '12px 0 0',
            }}>Thanks — email saved. Your download is starting.</p>
          ) : null}
          {isFree && !comingSoon && !p.digitalFileUrl ? (
            <p style={{
              fontFamily: 'var(--font-family-mono)', fontSize: '11px', color: 'var(--color-ink-55)',
              margin: '12px 0 0',
            }}>Download link not set yet.</p>
          ) : null}
        </div>
      </div>

      {/* Related store products only */}
      {relatedProducts.length > 0 ? (
        <div style={{
          padding: isMobile ? '40px 20px 64px' : '48px clamp(24px,5vw,64px) 80px',
          borderTop: '1px solid var(--color-stroke)',
        }}>
          <div style={{
            fontFamily: 'var(--font-family-mono)',
            fontSize: 'var(--font-label-size)',
            fontWeight: 500,
            letterSpacing: 'var(--font-label-tracking)',
            color: 'var(--color-ink-55)',
            textTransform: 'uppercase',
            marginBottom: 24,
          }}>
            More from the store
          </div>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fill, minmax(min(100%, 200px), 1fr))',
            gap: '40px 28px',
          }}>
            {relatedProducts.map((rp) => {
              const img = productImageUrl(rp);
              const rpSoon = isComingSoon(rp);
              const rpPrice = rpSoon ? 'Coming soon' : formatPrice(rp.priceCents, rp.fulfillmentType);
              const rpSold = isProductUnavailable(rp, physicalOrdersEnabled);
              const rpPaused = isShippingPaused(rp, physicalOrdersEnabled);
              const rpBadge = rpSoon ? 'Coming soon' : ((rpSold && !rpPaused) ? 'Sold out' : null);
              return (
                <button
                  key={rp._id || rp.slug}
                  type="button"
                  onClick={() => onOpenProduct && onOpenProduct(rp)}
                  style={{
                    background: 'none', border: 'none', padding: 0, cursor: 'pointer', textAlign: 'left',
                    display: 'flex', flexDirection: 'column', gap: 12,
                  }}
                >
                  <div style={{
                    width: '100%', aspectRatio: '4 / 5', background: 'var(--color-paper)',
                    borderRadius: '2px', overflow: 'hidden', position: 'relative',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>
                    {img ? (
                      <img
                        src={img + (img.includes('cdn.sanity.io') ? '?w=600&h=750&fit=crop&auto=format' : '')}
                        alt={rp.title || ''}
                        loading="lazy"

                    color: (rpSold && !rpSoon) ? 'var(--color-ink-55)' : 'var(--color-ink)',
                    textDecoration: (rpSold && !rpPaused && !rpSoon) ? 'line-through' : 'none',
                  }}>{rp.title}</div>
                  <div style={{
                    fontFamily: 'var(--font-family-mono)', fontSize: '12px',
                    color: 'var(--color-ink-55)',
                    textDecoration: (rpSold && !rpPaused && !rpSoon) ? 'line-through' : 'none',
                  }}>{rpPrice}</div>
                </button>
              );
            })}
          </div>
        </div>
      ) : null}

      <Footer onContact={onContact} onTag={onTag} onHome={onHome} />
    </div>
  );
}




function ResendDownloadsPage({ onMenu, onBack, onHome, onContact, onTag, dark, onToggleDark, cartCount, onCartOpen, cartOpen, menuOpen }) {
  useEffect(() => { window.scrollTo(0, 0); }, []);
  const [email, setEmail] = useState('');
  const [error, setError] = useState('');
  const [message, setMessage] = useState('');
  const [links, setLinks] = useState([]);

  const submit = () => {
    const e = String(email || '').trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) {
      setError('Enter the email you used to download.');
      setMessage('');
      setLinks([]);
      return;
    }
    setError('');
    let log = [];
    try { log = JSON.parse(localStorage.getItem('saboteur-download-log') || '[]'); } catch (err) { log = []; }
    const matches = log.filter((row) => String((row && row.email) || '').toLowerCase() === e);
    if (!matches.length) {
      setMessage('No downloads found for that email on this browser yet.');
      setLinks([]);
      return;
    }
    // unique by productId/title
    const seen = new Set();
    const unique = [];
    matches.slice().reverse().forEach((row) => {
      const key = row.productId || row.title || JSON.stringify(row);
      if (seen.has(key)) return;
      seen.add(key);
      unique.push(row);
    });
    setLinks(unique);
    setMessage('Found ' + unique.length + ' download(s). Open a link below to re-download.');
  };

  return (
    <div style={{ minHeight: '100vh', background: 'var(--color-paper)' }}>
      <TopBar onMenu={onMenu} showBack onBack={onBack} onHome={onHome} dark={dark} onToggleDark={onToggleDark} onTag={onTag} cartCount={cartCount} onCartOpen={onCartOpen} hidden={cartOpen || menuOpen} />
      <div style={{ padding: '128px clamp(20px,5vw,64px) 96px', maxWidth: 480, margin: '0 auto' }}>
        <h1 style={{ fontFamily: 'var(--font-family-display)', fontWeight: 700, fontSize: 'var(--font-h1-size)', margin: '0 0 12px', color: 'var(--color-ink)', letterSpacing: '-0.02em' }}>Re-send downloads</h1>
        <p style={{ fontFamily: 'var(--font-family-mono)', fontSize: '13px', color: 'var(--color-ink-55)', margin: '0 0 40px', lineHeight: 1.55 }}>
          Free files also stay on their product pages. This page lists downloads tied to your email on this browser. Full email delivery comes with Phase 2.
        </p>
        <label style={{ display: 'block', fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-ink-55)', marginBottom: 6 }}>Email</label>
        <input
          type="email"
          value={email}
          onChange={(ev) => { setEmail(ev.target.value); setError(''); setMessage(''); }}
          onKeyDown={(ev) => { if (ev.key === 'Enter') { ev.preventDefault(); submit(); } }}
          placeholder="you@domain.com"
          style={{
            width: '100%', boxSizing: 'border-box', height: 48, padding: '12px 16px', marginBottom: 12,
            borderRadius: 'var(--radius-sm)', border: error ? '2px solid var(--color-error)' : '1px solid var(--color-stroke)',
            background: 'var(--color-paper)', color: 'var(--color-ink)', fontFamily: 'var(--font-family-mono)', fontSize: '13px', outline: 'none',
          }}
        />
        {error ? <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-error)', marginBottom: 12 }}>{error}</div> : null}
        <button
          onClick={submit}
          style={{
            width: '100%', minHeight: 48, padding: '14px 28px', marginBottom: 20,
            background: 'var(--color-ink)', color: 'var(--color-paper)', border: 'none', borderRadius: 'var(--radius-sm)',
            cursor: 'pointer', fontFamily: 'var(--font-family-mono)', fontSize: '13px', fontWeight: 500,
          }}
          onMouseEnter={(e) => { e.currentTarget.style.background = 'var(--color-accent)'; e.currentTarget.style.color = '#fff'; }}
          onMouseLeave={(e) => { e.currentTarget.style.background = 'var(--color-ink)'; e.currentTarget.style.color = 'var(--color-paper)'; }}
        >
          Look up downloads
        </button>
        {message ? <p style={{ fontFamily: 'var(--font-family-mono)', fontSize: '13px', color: 'var(--color-ink-55)', margin: '0 0 16px' }}>{message}</p> : null}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {links.map((row, i) => (
            <div key={i} style={{ padding: '14px 0', borderBottom: '1px solid var(--color-stroke)' }}>
              <div style={{ fontFamily: 'var(--font-family-display)', fontWeight: 500, fontSize: '15px', color: 'var(--color-ink)', marginBottom: 6 }}>{row.title || 'Download'}</div>
              <button
                type="button"
                onClick={() => {
                  // Prefer stored URL if we saved it; otherwise user re-opens from product
                  const url = row.digitalFileUrl;
                  if (url) window.open(url, '_blank', 'noopener,noreferrer');
                  else setMessage('Open the product page to download again — link was not stored with this entry.');
                }}
                style={{
                  background: 'none', border: 'none', padding: 0, cursor: 'pointer',
                  fontFamily: 'var(--font-family-mono)', fontSize: '13px', color: 'var(--color-link)', textDecoration: 'underline',
                }}
              >
                {row.digitalFileUrl ? 'Download again' : 'Link not stored — use product page'}
              </button>
            </div>
          ))}
        </div>
      </div>
      <Footer onContact={onContact} onTag={onTag} onHome={onHome} />
    </div>
  );
}
