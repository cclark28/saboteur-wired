function CheckoutPage({ cart, physicalOrdersEnabled, physicalOrdersPausedMessage, onMenu, onBack, onHome, onContact, onTag, dark, onToggleDark, cartCount, onCartOpen, cartOpen, menuOpen, onContinueShopping, onUpdateQty, onRemoveLine }) {
  useEffect(() => { window.scrollTo(0, 0); }, []);
  const [checkoutBusy, setCheckoutBusy] = useState(false);
  const [checkoutError, setCheckoutError] = useState('');
  const totalCents = (cart || []).reduce((sum, l) => sum + (Number(l.priceCents) || 0) * (l.qty || 1), 0);
  const totalLabel = totalCents === 0 ? 'Free' : '$' + (totalCents / 100).toFixed(2);
  const hasPhysical = (cart || []).some((l) => {
    const t = l.fulfillmentType || '';
    return t === 'paid_physical' || t === 'paid_physical_variant' || String(t).indexOf('physical') >= 0 || l.fulfillmentLabel === 'Physical';
  });
  const shippingBlocked = hasPhysical && !arePhysicalOrdersLive(physicalOrdersEnabled);

  const placeOrder = async () => {
    setCheckoutError('');
    if (!(cart || []).length) {
      setCheckoutError('Your bag is empty.');
      return;
    }
    if (shippingBlocked) {
      setCheckoutError(physicalPauseCopy(physicalOrdersPausedMessage) + ' Remove them from your bag to continue.');
      return;
    }
    if (totalCents <= 0) {
      setCheckoutError('Free items download from the product page — no payment needed.');
      return;
    }
    if (!CHECKOUT_API_BASE) {
      setCheckoutError('Stripe is ready on our side next: deploy the API and paste CHECKOUT_API_BASE. Test cards work once that URL is set.');
      return;
    }
    setCheckoutBusy(true);
    try {
      const apiBase = CHECKOUT_API_BASE.replace(/\/$/, '');
      // Stripe requires real https URLs (file:// local HTML cannot be a return URL)
      const successUrl = apiBase + '/api/order-success?session_id={CHECKOUT_SESSION_ID}';
      const cancelUrl = apiBase + '/api/order-cancel';
      const res = await fetch(apiBase + '/api/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items: (cart || []).map((l) => ({
            title: l.title,
            priceCents: l.priceCents,
            quantity: l.qty || 1,
            productId: l.productId,
            variant: l.variant || null,
            fulfillmentType: l.fulfillmentType,
          })),
          successUrl: successUrl,
          cancelUrl: cancelUrl,
          siteUrl: apiBase,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.url) {
        throw new Error(data.error || 'Could not start checkout');
      }
      window.location.href = data.url;
    } catch (err) {
      setCheckoutError(err.message || 'Checkout failed');
      setCheckoutBusy(false);
    }
  };

  return (
    <div style={{ minHeight: '100vh', background: 'var(--color-paper)' }}>
      <TopBar onMenu={onMenu} showBack onBack={onBack} onHome={onHome} dark={dark} onToggleDark={onToggleDark} onTag={onTag} cartCount={cartCount} onCartOpen={onCartOpen} hidden={cartOpen || menuOpen} />
      <div style={{ padding: '128px clamp(20px,5vw,64px) 96px', maxWidth: 680, margin: '0 auto' }}>
        <h1 style={{ fontFamily: 'var(--font-family-display)', fontWeight: 700, fontSize: 'var(--font-h1-size)', margin: '0 0 12px', color: 'var(--color-ink)', letterSpacing: '-0.02em' }}>Checkout</h1>
        <p style={{ fontFamily: 'var(--font-family-mono)', fontSize: '13px', color: 'var(--color-ink-55)', margin: '0 0 48px', lineHeight: 1.55 }}>
          Review your bag. When Stripe is live, payment collects card details and — for physical items (comics, apparel) — the shipping address in the same checkout.
        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 28, marginBottom: 48 }}>
          {(cart || []).length === 0 ? (
            <p style={{ fontFamily: 'var(--font-family-mono)', fontSize: '13px', color: 'var(--color-ink-55)' }}>Your bag is empty.</p>
          ) : (cart || []).map((line) => {
            const isPhysical = (line.fulfillmentType === 'paid_physical' || line.fulfillmentType === 'paid_physical_variant' || line.fulfillmentLabel === 'Physical');
            const sizeText = line.sizeLabel || (line.variant ? ('Size ' + line.variant) : null);
            const d = line.productDetails || {};
            return (
            <div key={line.id} style={{ display: 'flex', gap: 20, alignItems: 'flex-start', paddingBottom: 28, borderBottom: '1px solid var(--color-stroke)' }}>
              <div style={{ width: 80, height: 100, flexShrink: 0, borderRadius: 'var(--radius-sm)', background: 'var(--color-card)', overflow: 'hidden' }}>
                {line.imageUrl ? <img src={line.imageUrl} alt={line.title || ''} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} /> : null}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: 'var(--font-family-display)', fontWeight: 500, fontSize: '16px', color: 'var(--color-ink)', marginBottom: 6 }}>{line.title}</div>
                <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '12px', fontWeight: 500, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--color-ink-55)', marginBottom: 6 }}>
                  {isPhysical ? 'Physical goods' : 'Digital'}
                </div>
                {sizeText ? (
                  <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '16px', fontWeight: 700, color: 'var(--color-ink)', marginBottom: 12, letterSpacing: '0.02em' }}>
                    Size: {(line.variant || String(sizeText || '').replace(/^Size\s+/i, ''))}
                  </div>
                ) : null}
                {isPhysical ? (
                  <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-ink-55)', lineHeight: 1.55, marginBottom: 8 }}>
                    {d.format ? <div>Format: {d.format}</div> : null}
                    {d.pages ? <div>Pages: {d.pages}</div> : null}
                    {d.size ? <div>Dimensions: {d.size}</div> : null}
                    {d.material ? <div>Material: {d.material}</div> : null}
                    {d.fit ? <div>Fit: {d.fit}</div> : null}
                    <div style={{ marginTop: 6 }}>Ships US only · Address collected at payment</div>
                  </div>
                ) : (
                  line.detailsSummary ? (
                    <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-ink-55)', marginBottom: 8 }}>{line.detailsSummary}</div>
                  ) : null
                )}
                <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '14px', fontWeight: 700, color: 'var(--color-ink)', fontVariantNumeric: 'tabular-nums', marginBottom: 10 }}>
                  {(line.priceCents > 0) ? ('$' + ((line.priceCents * (line.qty || 1)) / 100).toFixed(2)) : 'Free'}
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
                  <div style={{ display: 'inline-flex', alignItems: 'center', border: '1px solid var(--color-stroke)', borderRadius: 'var(--radius-sm)', overflow: 'hidden' }}>
                    <button
                      type="button"
                      aria-label="Decrease quantity"
                      onClick={() => onUpdateQty && onUpdateQty(line.id, (line.qty || 1) - 1)}
                      style={{ width: 36, height: 36, border: 'none', background: 'var(--color-paper)', color: 'var(--color-ink)', cursor: 'pointer', fontFamily: 'var(--font-family-mono)', fontSize: '16px', lineHeight: 1, padding: 0 }}
                    >−</button>
                    <span style={{ minWidth: 36, textAlign: 'center', fontFamily: 'var(--font-family-mono)', fontSize: '13px', fontWeight: 700, fontVariantNumeric: 'tabular-nums', color: 'var(--color-ink)' }}>{line.qty || 1}</span>
                    <button
                      type="button"
                      aria-label="Increase quantity"
                      onClick={() => onUpdateQty && onUpdateQty(line.id, (line.qty || 1) + 1)}
                      style={{ width: 36, height: 36, border: 'none', background: 'var(--color-paper)', color: 'var(--color-ink)', cursor: 'pointer', fontFamily: 'var(--font-family-mono)', fontSize: '16px', lineHeight: 1, padding: 0 }}
                    >+</button>
                  </div>
                  <button
                    type="button"
                    onClick={() => onRemoveLine && onRemoveLine(line.id)}
                    style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', fontFamily: 'var(--font-family-mono)', fontSize: '11px', color: 'var(--color-ink-55)', textDecoration: 'underline' }}
                  >
                    Remove
                  </button>
                </div>
              </div>
            </div>
            );
          })}
        </div>
        {(cart || []).length > 0 && (
          <div style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
            marginBottom: 40, paddingTop: 16, paddingBottom: 4,
            borderTop: '1px solid var(--color-stroke)',
            fontFamily: 'var(--font-family-mono)', color: 'var(--color-ink)',
          }}>
            <span style={{ fontSize: '13px', fontWeight: 500, letterSpacing: '0.04em', textTransform: 'uppercase' }}>Total</span>
            <span style={{ fontSize: '22px', fontWeight: 700, fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.02em' }}>{totalLabel}</span>
          </div>
        )}
        {shippingBlocked ? (
          <div style={{ margin: '0 0 16px' }}>
            <PhysicalPauseNotice
              compact
              message={physicalPauseCopy(physicalOrdersPausedMessage) + ' Remove them from your bag to continue.'}
            />
          </div>
        ) : hasPhysical ? (
          <p style={{ fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-ink-55)', margin: '0 0 16px', lineHeight: 1.5 }}>
            Physical items: shipping address is collected on the Stripe payment page (US only).
          </p>
        ) : null}
        {checkoutError ? (
          <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '12px', color: 'var(--color-error)', marginBottom: 12, lineHeight: 1.45 }}>{checkoutError}</div>
        ) : null}
        <button
          type="button"
          onClick={placeOrder}
          disabled={checkoutBusy || !(cart || []).length || totalCents <= 0 || shippingBlocked}
          style={{
            width: '100%', minHeight: 52, padding: '14px 28px', marginBottom: 10,
            background: (checkoutBusy || !(cart || []).length || totalCents <= 0 || shippingBlocked) ? 'var(--color-card)' : 'var(--color-ink)',
            color: (checkoutBusy || !(cart || []).length || totalCents <= 0 || shippingBlocked) ? 'var(--color-ink-55)' : 'var(--color-paper)',
            border: 'none',
            borderRadius: 'var(--radius-sm)',
            cursor: (checkoutBusy || !(cart || []).length || totalCents <= 0 || shippingBlocked) ? 'not-allowed' : 'pointer',
            fontFamily: 'var(--font-family-mono)', fontSize: '13px', fontWeight: 500,
            letterSpacing: '0.02em',
          }}
          onMouseEnter={(e) => {
            if (checkoutBusy || !(cart || []).length || totalCents <= 0 || shippingBlocked) return;
            e.currentTarget.style.background = 'var(--color-accent)';
            e.currentTarget.style.color = '#fff';
          }}
          onMouseLeave={(e) => {
            if (checkoutBusy || !(cart || []).length || totalCents <= 0 || shippingBlocked) {
              e.currentTarget.style.background = 'var(--color-card)';
              e.currentTarget.style.color = 'var(--color-ink-55)';
              return;
            }
            e.currentTarget.style.background = 'var(--color-ink)';
            e.currentTarget.style.color = 'var(--color-paper)';
          }}
        >
          {checkoutBusy ? 'Redirecting to Stripe…' : 'Place order'}
        </button>
        <button
          onClick={onContinueShopping}
          style={{
            width: '100%', minHeight: 48, padding: '14px 28px',
            background: 'transparent', color: 'var(--color-ink)', border: '1px solid var(--color-stroke)',
            borderRadius: 'var(--radius-sm)', cursor: 'pointer',
            fontFamily: 'var(--font-family-mono)', fontSize: '13px', fontWeight: 500,
          }}
        >
          Continue shopping
        </button>
      </div>
      <Footer onContact={onContact} onTag={onTag} onHome={onHome} />
    </div>
  );
}

/* ---------- About fly-out panel (~40% desktop, full-screen mobile) ---------- */
function AboutFlyout({ open, onClose, settings }) {
  const isMobile = useIsMobile(900);
  const s = settings || {};
  const headline = s.infoHeadline || s.aboutHeadline || 'About';
  const subhead = s.infoSubhead || s.aboutSubhead || '';
  const paragraphs = Array.isArray(s.infoParagraphs) ? s.infoParagraphs.filter(Boolean) : (s.aboutBody ? [s.aboutBody] : []);
  const mediaUrl = s.infoMediaUrl || s.aboutImageUrl || null;
  const mime = (s.infoMediaMime || '').toLowerCase();
  const isVideo = mediaUrl && (mime.startsWith('video/') || /\.(mp4|webm|mov)(\?|$)/i.test(mediaUrl));

  // Body scroll lock + Esc
  useEffect(() => {
    if (!open) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => {
      document.body.style.overflow = prev;
      window.removeEventListener('keydown', onKey);
    };
  }, [open, onClose]);

  if (!open) return null;

  const panelWidth = isMobile ? '100%' : 'min(440px, 42vw)';
  const panelBg = 'var(--color-paper)'; // surface / quiet grey-white in both modes

  return (
    <div
      role="dialog"
      aria-modal="true"
      aria-label="About"
      style={{
        position: 'fixed',
        inset: 0,
        zIndex: 450,
        display: 'flex',
        justifyContent: 'flex-end',
        pointerEvents: 'auto',
      }}
    >
      {/* Dimmed backdrop */}
      <div
        onClick={onClose}
        style={{
          position: 'absolute',
          inset: 0,
          background: 'rgba(24, 24, 27, 0.45)',
          cursor: 'pointer',
        }}
      />

      {/* Panel */}
      <div
        style={{
          position: 'relative',
          width: panelWidth,
          maxWidth: '100%',
          height: '100%',
          background: panelBg,
          borderLeft: isMobile ? 'none' : '1px solid var(--color-stroke)',
          display: 'flex',
          flexDirection: 'column',
          boxShadow: isMobile ? 'none' : '-8px 0 32px rgba(0,0,0,0.08)',
          animation: isMobile ? 'none' : 'aboutSlideIn 0.28s var(--ease, cubic-bezier(0.22,1,0.36,1))',
        }}
      >
        <style>{`
          @keyframes aboutSlideIn {
            from { transform: translateX(12px); opacity: 0.96; }
            to { transform: translateX(0); opacity: 1; }
          }
          @media (prefers-reduced-motion: reduce) {
            [data-about-panel] { animation: none !important; }
          }
        `}</style>

        {/* Header row: label + Close */}
        <div
          data-about-panel
          style={{
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            padding: isMobile ? '20px 20px 12px' : '24px 28px 16px',

function GalleryPanel({ series }) {
  const [meta, setMeta] = useState({});

  const items = [];
  const seen = new Set();
  const push = (type, src) => {
    if (!src || seen.has(src)) return;
    seen.add(src);
    items.push({ type, src });
  };
  if (series.galleryUrls && series.galleryUrls.length) {
    series.galleryUrls.forEach((u) => {
      if (/\.(mp4|webm|mov)(\?|$)/i.test(String(u))) push('video', u);
      else push('image', u);
    });
  }
  if (series.imageUrl) push('image', series.imageUrl);
  if (series.videoUrl) push('video', series.videoUrl);
  if (!items.length) return null;

  const setDims = (src, w, h) => {
    if (!w || !h) return;
    const orient = w >= h ? 'landscape' : 'portrait';
    setMeta((prev) => {
      if (prev[src] && prev[src].orient === orient) return prev;
      return { ...prev, [src]: { w, h, orient } };
    });
  };

  useEffect(() => {
    if (series.imageUrl && series.size && series.size.w && series.size.h) {
      setDims(series.imageUrl, series.size.w, series.size.h);
    }
  }, [series.imageUrl, series.size]);

  // ONE shared gap token — same as MasonryGrid (Home + sections). Uniform everywhere.
  // Single column stack so every photo gets equal vertical spacing. No 2-col uneven rows.
  const gap = 'clamp(24px, 2.8vw, 32px)';

  return (
    <div style={{
      width: '100%',
      display: 'flex',
      flexDirection: 'column',
      gap,
    }}>
      {items.map((item, i) => {
        const orient = meta[item.src] ? meta[item.src].orient : null;
        const isPort = orient === 'portrait';
        const style = {
          width: '100%',
          maxWidth: isPort ? 'min(100%, 520px)' : '100%',
          height: 'auto',
          display: 'block',
          objectFit: 'contain',
          background: 'transparent',
          borderRadius: '2px',
        };
        return (
          <div key={item.src || i} style={{ width: '100%', display: 'flex', justifyContent: isPort ? 'center' : 'stretch' }}>
            <div className="photo-wrap photo-parallax" data-parallax style={{ width: '100%', maxWidth: style.maxWidth }}>
              {item.type === 'video' ? (
                <video
                  src={item.src}
                  muted
                  playsInline
                  autoPlay
                  loop
                  style={{ ...style, margin: 0, maxWidth: '100%' }}
                  onLoadedMetadata={(e) => setDims(item.src, e.currentTarget.videoWidth, e.currentTarget.videoHeight)}
                />
              ) : (
                <img
                  src={item.src}
                  alt={series.title || series.headline || ''}
                  loading={i === 0 ? 'eager' : 'lazy'}
                  style={{ ...style, margin: 0, maxWidth: '100%' }}
                  onLoad={(e) => setDims(item.src, e.currentTarget.naturalWidth, e.currentTarget.naturalHeight)}
                />
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function TypewriterLabel({ text, speed = 60 }) {
  const [i, setI] = useState(0);
  useEffect(() => {
    setI(0);
    const t = setInterval(() => {
      setI((prev) => {
        if (prev >= text.length) { clearInterval(t); return prev; }
        return prev + 1;
      });
    }, speed);
    return () => clearInterval(t);
  }, [text, speed]);
  return <span>{text.slice(0, i)}<span style={{ opacity: i < text.length ? 1 : 0, animation: 'clockTick 0.5s steps(1) infinite' }}>|</span></span>;
}

      <div style={{ width: '100%' }}>
        <label style={labelStyle}>Email</label>
        <input required type="email" name="email" autoComplete="email" value={email} onChange={(e) => setEmail(e.target.value)} style={fieldStyle} />
      </div>
      <div style={{ width: '100%' }}>
        <label style={labelStyle}>Message</label>
        <textarea required name="message" rows={6} value={message} onChange={(e) => setMessage(e.target.value)} style={{ ...fieldStyle, resize: 'vertical', minHeight: 140 }} />
      </div>
      {status === 'error' && (
        <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: 'var(--font-label-size)', color: 'var(--color-accent)' }}>
          Something went wrong. Try again.
        </div>
      )}
      <button
        type="submit"
        disabled={status === 'sending'}
        style={{
          alignSelf: 'center',
          minWidth: 140,
          background: 'var(--color-accent)',
          color: '#fff',
          border: 'none',
          borderRadius: 'var(--radius-sm)',
          padding: '14px 36px',
          fontFamily: 'var(--font-family-mono)',
          fontSize: 'var(--font-label-size)',
          fontWeight: 500,
          cursor: status === 'sending' ? 'wait' : 'pointer',
          opacity: status === 'sending' ? 0.7 : 1,
        }}
      >
        {status === 'sending' ? 'Sending…' : 'Send'}
      </button>
    </form>
  );
}


function ContactPage({ onMenu, onBack, onHome, dark, onToggleDark, cartCount, onCartOpen, cartOpen, menuOpen }) {
  useEffect(() => { window.scrollTo(0, 0); }, []);
  return (
    <div>
      <TopBar onMenu={onMenu} showBack onBack={onBack} onHome={onHome} dark={dark} onToggleDark={onToggleDark} cartCount={cartCount} onCartOpen={onCartOpen} hidden={cartOpen || menuOpen} />

        minHeight: 'calc(100vh - 160px)',
        display: 'flex',
        flexDirection: 'column',

        justifyContent: 'center',

      }}>
        <h1 style={{

          fontWeight: 700,
          fontSize: 'var(--font-h1-size)',

function labelForView(view) {
  if (!view) return 'Home';
  if (view.page === 'home') return 'Home';
  if (view.page === 'store') return 'Store';
  if (view.page === 'product') return (view.product && view.product.title) || 'Product';
  if (view.page === 'item') return (view.series && (view.series.title || view.series.headline)) || 'Item';
  if (view.page === 'tag') return 'Tag: ' + (view.tag || '');
  if (view.page === 'info' || view.page === 'contact') return 'About';
  if (view.page === 'checkout') return 'Checkout';
  if (view.page === 'resend') return 'Re-send downloads';
  if (view.page === 'order-success') return 'Order confirmation';
  return view.page || 'Home';
}

      // Keep query only for Stripe return / checkout; otherwise clean URL

      if (nextView.page === 'order-success' || nextView.page === 'checkout') {
        search = window.location.search || '';
      }
      window.history[method](nextView, '', path + search);
    } catch (e) {
      // Safari private mode / older browsers — fail silently, UI still works
    }
  }, []);

  // Initial path parse + popstate listener
  useEffect(() => {
    let initial = viewFromPath(window.location.pathname, window.location.search);
    try {
      const params = new URLSearchParams(window.location.search);
      const qPage = params.get('page');
      if (qPage === 'order-success') {
        initial = { page: 'order-success', sessionId: params.get('session_id') || '' };
      } else if (qPage === 'checkout') {
        initial = { page: 'checkout' };

    } catch (e) {}
    // /about is a fly-out over home (or current), not a separate page view
    if (initial.page === 'about') {

      try {

      } else {
        setAboutOpen(false);

        let nav = sectionDocs.map((s) => ({

          SECTION_META = [

          setProducts([

              priceCents: 1800,
              fulfillmentType: 'paid_physical',
              category: 'comics',

              published: true,

              imageUrl: null,
              stock: 40,

            },
            {

              priceCents: 3800,

            },
          ]);

 finally {

    })();

  const openItem = (series, from) => {
    if (series && series.isProduct && series.product) {
      navigate({ page: 'product', product: series.product });
      return;
    }
    navigate({ page: 'item', series, from: from || view.page });
  };

  const addToCart = React.useCallback((product, variant) => {
    if (!product) return;
    // Never allow coming-soon, sold-out, or shipping-paused physical products into the bag
    const physicalOn = arePhysicalOrdersLive(siteSettings && siteSettings.physicalOrdersEnabled);
    if (isProductUnavailable(product, physicalOn)) return;
    setCart((prev) => {
      const lineId = String(product._id || product.slug || product.title) + (variant ? '::' + variant : '');
      const existing = prev.find((l) => l.id === lineId);
      let next;
      if (existing) {
        next = prev.map((l) => l.id === lineId ? { ...l, qty: (l.qty || 1) + 1 } : l);
      } else {
        const ft = product.fulfillmentType || 'free_digital';
        const isPhysical = ft === 'paid_physical' || ft === 'paid_physical_variant';
        const details = product.productDetails || {};
        const detailBits = [
          details.format,
          details.pages,
          details.size,
          details.material,
          details.fit,
          details.resolution,
        ].filter(Boolean);
        next = [...prev, {
          id: lineId,
          productId: product._id,
          title: product.title || 'Item',
          priceCents: product.priceCents || 0,
          fulfillmentType: ft,
          fulfillmentLabel: isPhysical ? 'Physical' : (ft === 'free_digital' || ft === 'paid_digital' ? 'Digital' : 'Item'),
          category: product.category || null,
          imageUrl: productImageUrl(product),
          variant: variant || null,
          sizeLabel: variant ? ('Size ' + variant) : null,
          detailsSummary: detailBits.join(' · '),
          productDetails: details,
          qty: 1,
          digitalFileUrl: product.digitalFileUrl || null,
        }];
      }
      try { localStorage.setItem('saboteur-cart', JSON.stringify(next)); } catch {}
      return next;
    });
    setMenuOpen(false);
    setLandingMenu(false);
    setLandingDone(true);
    setCartOpen(true);
  }, [siteSettings]);

  const removeFromCart = React.useCallback((lineId) => {
    setCart((prev) => {
      const next = prev.filter((l) => l.id !== lineId);
      try { localStorage.setItem('saboteur-cart', JSON.stringify(next)); } catch {}
      return next;
    });
  }, []);

  const updateCartQty = React.useCallback((lineId, nextQty) => {
    const q = Math.max(0, Math.min(99, Number(nextQty) || 0));
    setCart((prev) => {
      let next;
      if (q <= 0) {
        next = prev.filter((l) => l.id !== lineId);
      } else {
        next = prev.map((l) => (l.id === lineId ? { ...l, qty: q } : l));
      }
      try { localStorage.setItem('saboteur-cart', JSON.stringify(next)); } catch {}
      return next;
    });
  }, []);

  const closeMenu = React.useCallback(() => {
    setMenuOpen(false);
    setLandingMenu(false);
    setLandingDone(true);
  }, []);

  // Homepage landing: after age gate, open the full menu once. Scroll / Escape / click dismisses it.
  // Only on the home page entry — never on other pages or subsequent home visits.
  useEffect(() => {
    if (ageVerified && view.page === 'home' && !landingDone && !loading) {
      setMenuOpen(true);
      setLandingMenu(true);
    }
  }, [ageVerified, view.page, landingDone, loading]);

  const goHome = () => { closeMenu(); setAboutOpen(false); navigate({ page: 'home' }); window.scrollTo(0, 0); };
  const refreshHome = React.useCallback(() => {
    setItems((prev) => {
      const list = prev && prev.home;
      if (!list || !list.length) return prev;
      return { ...prev, home: shuffle(list) };
    });
  }, []);
  const goStoreComics = () => {
    closeMenu();
    setAboutOpen(false);
    navigate({ page: 'store', storeCategory: 'comics', storeResetKey: Date.now() });
    window.scrollTo(0, 0);
  };
  const openAbout = () => {
    closeMenu();
    setAboutOpen(true);
    try {
      window.history.pushState({ page: 'about' }, '', '/about');
    } catch (e) {}
  };
  const closeAbout = () => {
    setAboutOpen(false);
    // If we were on /about, clean the URL back to current view
    try {
      if (window.location.pathname === '/about' || window.location.pathname === '/info') {
        const path = pathFromView(view.page === 'about' ? { page: 'home' } : view);
        window.history.replaceState(view, '', path);
      }
    } catch (e) {}
  };
  const openSection = (section) => {
    const raw = String(section || '').trim();
    const slug = raw.toLowerCase().replace(/\s+/g, '-');
    if (slug === 'figure-studies' || /figure\s*studies/i.test(raw)) return;
    const storeTab = resolveStoreTab({ label: raw, sectionSlug: slug });
    if (storeTab && slug !== 'store') {
      closeMenu();
      setAboutOpen(false);
      navigate({ page: 'store', storeCategory: storeTab, storeResetKey: Date.now() });
      window.scrollTo(0, 0);
      return;
    }
    const meta = (SECTION_META || []).find((s) =>
      s.slug === raw || s.slug === slug ||
      (s.title || '').toLowerCase().replace(/\s+/g, '-') === slug
    );
    // Store is always open now — ignore comingSoon for store only
    if (meta && meta.comingSoon && slug !== 'store' && (meta.slug || '') !== 'store') return;
    closeMenu();
    // About is a fly-out panel, not a full page
    if (meta && (meta.isInfoPage || meta.isAbout) || slug === 'info' || slug === 'info-contact' || slug === 'about') {
      openAbout();
      return;
    }
    setAboutOpen(false);
    navigate({ page: (meta && meta.slug) ? meta.slug : slug });
    window.scrollTo(0, 0);
  };
  const goContact = () => { openAbout(); };
  FOOTER_NAV = {
    home: goHome,
    contact: () => { openAbout(); },
    section: (slug) => openSection(slug),
    store: (category) => {
      closeMenu();
      setAboutOpen(false);
      navigate({
        page: 'store',
        storeCategory: category || undefined,
        storeResetKey: Date.now(),
      });
      window.scrollTo(0, 0);
    },
    comics: goStoreComics,
    resend: () => { closeMenu(); setAboutOpen(false); navigate({ page: 'resend' }); window.scrollTo(0, 0); },
  };
  // Phase 2 return from Stripe (kept for safety; initial path parse also reads the query)
  useEffect(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      const page = params.get('page');
      if (page === 'order-success') {
        navigate({ page: 'order-success', sessionId: params.get('session_id') || '' }, { replace: true });
      } else if (page === 'checkout') {
        navigate({ page: 'checkout' }, { replace: true });
      }
    } catch (e) {}
  }, []);

  // Resolve product by slug when landing on /store/{slug} (or after products load)
  useEffect(() => {
    if (view.page !== 'product' || view.product || !view.productSlug) return;
    if (!products || !products.length) return;
    const found = products.find((p) => String(p.slug || '') === String(view.productSlug));
    if (found) {
      setView((prev) => (prev.page === 'product' && prev.productSlug === view.productSlug && !prev.product
        ? { ...prev, product: found }
        : prev));
    } else {
      // Unknown slug → fall back to store grid
      navigate({ page: 'store' }, { replace: true });
    }
  }, [products, view.page, view.productSlug, view.product, navigate]);

  const goTag = (tag) => { closeMenu(); navigate({ page: 'tag', tag }); window.scrollTo(0, 0); };
  // UI Back button uses the real browser history so the stack stays consistent
  const back = () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      navigate({ page: 'home' }, { replace: true });
    }
  };

  // Subtle desktop-only parallax on photos (never on mobile, never with reduced-motion)
  useEffect(() => {
    const mq = window.matchMedia('(min-width: 1024px)');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    let ticking = false;

    const update = () => {
      if (!mq.matches || reduce.matches) {
        document.querySelectorAll('[data-parallax]').forEach((el) => {
          el.style.transform = '';
        });
        return;
      }
      const vh = window.innerHeight;
      document.querySelectorAll('[data-parallax]').forEach((el) => {
        const rect = el.getBoundingClientRect();
        // Only affect elements that are near the viewport
        if (rect.bottom < -100 || rect.top > vh + 100) return;
        const center = rect.top + rect.height / 2;
        const offset = (center - vh / 2) / vh; // -0.5 … 0.5 roughly
        const move = Math.max(-12, Math.min(12, offset * -18)); // max ±12px — approved subtle parallax
        el.style.transform = `translate3d(0, ${move.toFixed(1)}px, 0)`;


      });
      ticking = false;
    };

    const onScroll = () => {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    };

    update();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', update);
    mq.addEventListener('change', update);
    reduce.addEventListener('change', update);

    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', update);
      mq.removeEventListener('change', update);
      reduce.removeEventListener('change', update);
    };
  }, [view.page]); // re-run when the page / grid changes

  const menuLinks = React.useMemo(() => {
    const titles = (navSections || [])
      .filter((s) => !s.isInfoPage)
      .map((s) => s.title)
      .filter(Boolean);
    if (!titles.length) return [];
    if (!titles.some((t) => String(t).toLowerCase() === 'store')) titles.push('Store');
    if (!titles.some((t) => String(t).toLowerCase() === 'about')) titles.push('About');
    return titles;
  }, [navSections]);

  return (
    <div data-theme={dark ? 'dark' : 'light'} style={{ minHeight: '100vh', background: 'var(--color-paper)' }}>
      <div className="sr-only" aria-live="polite" aria-atomic="true">{labelForView(view)}</div>
      <main id="main">

      {!loading && view.page === 'home' && <Home onMenu={() => { setCartOpen(false); setMenuOpen(true); }} onOpen={(s) => openItem(s, 'home')} onContact={goContact} onTag={goTag} onHome={goHome} onRefresh={refreshHome} items={items.home} dark={dark} onToggleDark={toggleDark} cartCount={cartCount} onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }} cartOpen={cartOpen} menuOpen={menuOpen} />}
      {!loading && navSections.filter((sec) => !sec.isInfoPage && sec.slug !== 'store').map((sec) => view.page === sec.slug && (<SectionGrid key={sec.slug} title={sec.title} items={items[sec.slug] || []} onMenu={() => { setCartOpen(false); setMenuOpen(true); }} onBack={goHome} onOpen={(s) => openItem(s, sec.slug)} onContact={goContact} onTag={goTag} onHome={goHome} dark={dark} onToggleDark={toggleDark} cartCount={cartCount} onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }} cartOpen={cartOpen} menuOpen={menuOpen} />))}
      {!loading && view.page === 'store' && (
        <StoreGrid
          key={view.storeResetKey || 'store'}
          products={products}
          initialCategory={view.storeCategory}
          physicalOrdersEnabled={siteSettings && siteSettings.physicalOrdersEnabled}
          physicalOrdersPausedMessage={siteSettings && siteSettings.physicalOrdersPausedMessage}
          onMenu={() => { setCartOpen(false); setMenuOpen(true); }}
          onBack={goHome}
          onHome={goHome}
          onContact={goContact}
          onTag={goTag}
          dark={dark}
          onToggleDark={toggleDark}
          cartCount={cartCount}
          onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }}
          cartOpen={cartOpen}
          menuOpen={menuOpen}
          onOpenProduct={(p) => {
            navigate({ page: 'product', product: p });
          }}
        />
      )}

      {!loading && view.page === 'product' && view.product && (
        <ProductDetail
          product={view.product}
          allProducts={products}
          physicalOrdersEnabled={siteSettings && siteSettings.physicalOrdersEnabled}
          physicalOrdersPausedMessage={siteSettings && siteSettings.physicalOrdersPausedMessage}
          onMenu={() => { setCartOpen(false); setMenuOpen(true); }}
          onBack={back}
          onHome={goHome}
          onContact={goContact}
          onTag={goTag}
          dark={dark}
          onToggleDark={toggleDark}
          cartCount={cartCount}
          onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }}
          cartOpen={cartOpen}
          menuOpen={menuOpen}
          onAddToCart={addToCart}
          onOpenProduct={(p) => { navigate({ page: 'product', product: p }); window.scrollTo(0, 0); }}
        />
      )}
      
      {!loading && view.page === 'resend' && (
        <ResendDownloadsPage
          onMenu={() => { setCartOpen(false); setMenuOpen(true); }}
          onBack={back}
          onHome={goHome}
          onContact={goContact}
          onTag={goTag}
          dark={dark}
          onToggleDark={toggleDark}
          cartCount={cartCount}
          onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }}
          cartOpen={cartOpen}
          menuOpen={menuOpen}
        />
      )}
      
      {!loading && view.page === 'order-success' && (
        <OrderSuccessPage
          onMenu={() => { setCartOpen(false); setMenuOpen(true); }}
          onBack={back}
          onHome={goHome}
          onContact={goContact}
          onTag={goTag}
          dark={dark}
          onToggleDark={toggleDark}
          cartCount={cartCount}
          onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }}
          cartOpen={cartOpen}
          menuOpen={menuOpen}
          sessionId={(typeof view.sessionId !== 'undefined' && view.sessionId) || (new URLSearchParams(window.location.search).get('session_id'))}
          onClearCart={() => { setCart([]); try { localStorage.setItem('saboteur-cart', '[]'); } catch (e) {} }}
        />
      )}
      
      {!loading && view.page === 'checkout' && (
        <CheckoutPage
          cart={cart}
          physicalOrdersEnabled={siteSettings && siteSettings.physicalOrdersEnabled}
          physicalOrdersPausedMessage={siteSettings && siteSettings.physicalOrdersPausedMessage}
          onMenu={() => { setCartOpen(false); setMenuOpen(true); }}
          onBack={back}
          onHome={goHome}
          onContact={goContact}
          onTag={goTag}
          dark={dark}
          onToggleDark={toggleDark}
          cartCount={cartCount}
          onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }}
          cartOpen={cartOpen}
          menuOpen={menuOpen}
          onContinueShopping={() => { openSection('store'); }}
          onUpdateQty={updateCartQty}
          onRemoveLine={removeFromCart}
        />
      )}
      
      {!loading && view.page === 'info' && <InfoContact settings={siteSettings} onMenu={() => { setCartOpen(false); setMenuOpen(true); }} onBack={goHome} onContact={goContact} onTag={goTag} onHome={goHome} dark={dark} onToggleDark={toggleDark} cartCount={cartCount} onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }} cartOpen={cartOpen} menuOpen={menuOpen} />}
      {!loading && view.page === 'contact' && <ContactPage onMenu={() => { setCartOpen(false); setMenuOpen(true); }} onBack={goHome} onHome={goHome} dark={dark} onToggleDark={toggleDark} cartCount={cartCount} onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }} cartOpen={cartOpen} menuOpen={menuOpen} />}
      {!loading && view.page === 'tag' && <SectionGrid title={'Tag: ' + displayTagTitle(view.tag)} items={(items.home || []).filter((s) => {
        const tags = (s.tags || []).map((t) => String(typeof t === 'string' ? t : (t && t.title) || ''));
        const wanted = displayTagTitle(view.tag);
        if (isBooksAndZinesLabel(wanted)) {
          return tags.some((t) => isBooksAndZinesLabel(t) || isFigureStudiesLabel(t));
        }
        return tags.some((t) => t.toLowerCase() === String(wanted || '').toLowerCase());
      })} onMenu={() => { setCartOpen(false); setMenuOpen(true); }} onBack={goHome} onOpen={(s) => openItem(s, 'tag')} onContact={goContact} onTag={goTag} onHome={goHome} dark={dark} onToggleDark={toggleDark} cartCount={cartCount} onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }} cartOpen={cartOpen} menuOpen={menuOpen} />}
      {!loading && view.page === 'item' && <SingleItem series={view.series} allItems={(items[view.from] || items.home || [])} onMenu={() => { setCartOpen(false); setMenuOpen(true); }} onBack={back} onOpen={(s) => openItem(s, view.from)} onContact={goContact} onTag={goTag} onHome={goHome} dark={dark} onToggleDark={toggleDark} cartCount={cartCount} onCartOpen={() => { setMenuOpen(false); setLandingMenu(false); setLandingDone(true); setCartOpen(true); }} cartOpen={cartOpen} menuOpen={menuOpen} />}
      </main>
      {!loading && menuOpen && (
        <FullMenu
          activeSection={view.page === 'item' ? view.from : (view.page === 'product' ? 'store' : view.page)}
          onSelect={openSection}
          onClose={closeMenu}
          onHome={goHome}
          onTag={(t) => { closeMenu(); goTag(t); }}
          isLanding={landingMenu}
          links={menuLinks}
        />
      )}
      {!loading && (
      <AboutFlyout
        open={aboutOpen}
        onClose={closeAbout}
        settings={siteSettings}
      />
      )}
      {cartOpen && (
        <div
          style={{
            position: 'fixed',
            inset: 0,
            zIndex: 400,
            background: 'rgba(24,24,27,0.6)',
            display: 'flex',
            justifyContent: 'flex-end',
          }}
          onClick={() => setCartOpen(false)}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              width: (typeof window !== 'undefined' && window.innerWidth < 768) ? '100%' : 'min(40%, 520px)',
              height: '100%',
              background: 'var(--color-surface, #FAFAFB)',
              display: 'flex',
              flexDirection: 'column',
              borderLeft: (typeof window !== 'undefined' && window.innerWidth < 768) ? 'none' : '1px solid var(--color-stroke)',
              boxShadow: 'var(--shadow-3)',
            }}
          >
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '20px 24px', borderBottom: '1px solid var(--color-stroke)', flexShrink: 0 }}>
              <span style={{ fontFamily: 'var(--font-family-mono)', fontSize: '13px', fontWeight: 500, letterSpacing: '0.02em', textTransform: 'uppercase', color: 'var(--color-ink)' }}>
                Your bag ({cartCount})
              </span>
              <button
                onClick={() => setCartOpen(false)}
                aria-label="Close bag"
                style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--color-ink)', padding: 0 }}
              >
                <img src="/assets/icons/close.svg" style={{ width: 24, height: 24, filter: 'var(--logo-filter, none)' }} alt="" />
              </button>
            </div>
            <div style={{ flex: 1, minHeight: 0, padding: cartCount === 0 ? '48px 24px' : '16px 24px 20px', display: 'flex', flexDirection: 'column', alignItems: cartCount === 0 ? 'center' : 'stretch', justifyContent: cartCount === 0 ? 'center' : 'flex-start', overflow: 'hidden' }}>
              {cartCount === 0 ? (
                <>
                  <p style={{ fontFamily: 'var(--font-family-mono)', fontSize: '13px', color: 'var(--color-ink-55)', margin: '0 0 16px', textAlign: 'center' }}>
                    Your bag is empty
                  </p>
                  <button
                    onClick={() => { setCartOpen(false); openSection('store'); }}
                    style={{ background: 'none', border: 'none', color: 'var(--color-link)', fontFamily: 'var(--font-family-mono)', fontSize: '13px', cursor: 'pointer', textDecoration: 'underline', padding: 0 }}
                  >
                    Browse the store →
                  </button>
                </>
              ) : (
                <>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 24, flex: 1, overflowY: 'auto', minHeight: 0, paddingBottom: 16 }}>
                    {cart.map((line) => (
                      <div key={line.id} style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
                        <div style={{
                          width: 80, height: 100, flexShrink: 0, borderRadius: 'var(--radius-sm)',
                          background: 'var(--color-card)', overflow: 'hidden',
                        }}>
                          {line.imageUrl ? (
                            <img src={line.imageUrl + (String(line.imageUrl).includes('cdn.sanity.io') ? '?w=200&h=250&fit=crop&auto=format' : '')} alt={line.title || ''} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                          ) : null}
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontFamily: 'var(--font-family-display)', fontWeight: 500, fontSize: '15px', color: 'var(--color-ink)', marginBottom: 4 }}>{line.title}</div>
                          <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '11px', fontWeight: 500, color: 'var(--color-ink-55)', marginBottom: 4, letterSpacing: '0.04em', textTransform: 'uppercase' }}>
                            {line.fulfillmentLabel || (line.fulfillmentType && String(line.fulfillmentType).indexOf('physical') >= 0 ? 'Physical' : 'Item')}
                          </div>
                          {(line.sizeLabel || line.variant) ? (
                            <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '14px', fontWeight: 700, color: 'var(--color-ink)', marginBottom: 6, letterSpacing: '0.02em' }}>
                              Size: {(line.variant || String(line.sizeLabel || '').replace(/^Size\s+/i, ''))}
                            </div>
                          ) : null}
                          {line.detailsSummary ? (
                            <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '11px', color: 'var(--color-ink-55)', marginBottom: 4 }}>{line.detailsSummary}</div>
                          ) : null}
                          <div style={{ fontFamily: 'var(--font-family-mono)', fontSize: '13px', fontWeight: 700, color: 'var(--color-ink)', marginBottom: 10, fontVariantNumeric: 'tabular-nums' }}>
                            {(line.priceCents > 0) ? ('$' + ((line.priceCents * (line.qty || 1)) / 100).toFixed(2)) : 'Free'}
                          </div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
                            <div style={{ display: 'inline-flex', alignItems: 'center', border: '1px solid var(--color-stroke)', borderRadius: 'var(--radius-sm)', overflow: 'hidden' }}>
                              <button
                                type="button"
                                aria-label="Decrease quantity"
                                onClick={() => updateCartQty(line.id, (line.qty || 1) - 1)}
                                style={{
                                  width: 36, height: 36, border: 'none', background: 'var(--color-paper)',
                                  color: 'var(--color-ink)', cursor: 'pointer', fontFamily: 'var(--font-family-mono)',
                                  fontSize: '16px', lineHeight: 1, padding: 0,
                                }}
                              >−</button>
                              <span style={{
                                minWidth: 36, textAlign: 'center', fontFamily: 'var(--font-family-mono)',
                                fontSize: '13px', fontWeight: 700, fontVariantNumeric: 'tabular-nums', color: 'var(--color-ink)',
                              }}>{line.qty || 1}</span>
                              <button
                                type="button"
                                aria-label="Increase quantity"
                                onClick={() => updateCartQty(line.id, (line.qty || 1) + 1)}
                                style={{
                                  width: 36, height: 36, border: 'none', background: 'var(--color-paper)',
                                  color: 'var(--color-ink)', cursor: 'pointer', fontFamily: 'var(--font-family-mono)',
                                  fontSize: '16px', lineHeight: 1, padding: 0,
                                }}
                              >+</button>
                            </div>
                            <button
                              type="button"
                              onClick={() => removeFromCart(line.id)}
                              style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', fontFamily: 'var(--font-family-mono)', fontSize: '11px', color: 'var(--color-ink-55)', textDecoration: 'underline' }}
                            >
                              Remove
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div style={{
                    flexShrink: 0,
                    marginTop: 'auto',
                    padding: '20px 0 4px',
                    borderTop: '1px solid var(--color-stroke)',
                    display: 'flex',
                    flexDirection: 'column',
                    gap: 12,
                    background: 'var(--color-surface, #FAFAFB)',
                    position: 'relative',
                    zIndex: 2,
                  }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
                      <span style={{ fontFamily: 'var(--font-family-mono)', fontSize: '12px', fontWeight: 500, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--color-ink-55)' }}>Total</span>
                      <span style={{ fontFamily: 'var(--font-family-mono)', fontSize: '18px', fontWeight: 700, color: 'var(--color-ink)', fontVariantNumeric: 'tabular-nums' }}>
                        {(() => {
                          const t = (cart || []).reduce((s, l) => s + (Number(l.priceCents) || 0) * (l.qty || 1), 0);
                          return t === 0 ? 'Free' : '$' + (t / 100).toFixed(2);
                        })()}
                      </span>
                    </div>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        setCartOpen(false);
                        navigate({ page: 'checkout' });
                        try { window.scrollTo(0, 0); } catch (err) {}
                      }}
                      style={{
                        width: '100%', minHeight: 52, padding: '14px 28px',
                        background: 'var(--color-ink)', color: 'var(--color-paper)', border: 'none',
                        borderRadius: 'var(--radius-sm)', cursor: 'pointer',
                        fontFamily: 'var(--font-family-mono)', fontSize: '13px', fontWeight: 500,
                        letterSpacing: '0.02em',
                        pointerEvents: 'auto',
                      }}
                      onMouseEnter={(e) => { e.currentTarget.style.background = 'var(--color-accent)'; e.currentTarget.style.color = '#fff'; }}
                      onMouseLeave={(e) => { e.currentTarget.style.background = 'var(--color-ink)'; e.currentTarget.style.color = 'var(--color-paper)'; }}
                    >
                      Checkout
                    </button>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        setCartOpen(false);
                        openSection('store');
                      }}
                      style={{
                        width: '100%', minHeight: 48, padding: '14px 28px',
                        background: 'transparent', color: 'var(--color-ink)', border: '1px solid var(--color-stroke)',
                        borderRadius: 'var(--radius-sm)', cursor: 'pointer',
                        fontFamily: 'var(--font-family-mono)', fontSize: '13px', fontWeight: 500,
                        pointerEvents: 'auto',
                      }}
                    >
                      Continue shopping
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      )}
  {!ageVerified && (
  <AgeGate
    onConfirm={() => {
      try {
        localStorage.setItem('saboteur-age-verified', 'true');
      } catch {}
      setAgeVerified(true);
      // Keep the URL they arrived on (e.g. /store?tab=comics). Re-read location so a
      // fast confirm cannot wipe a deep link still sitting in the default home state.
      const current = viewFromPath(window.location.pathname, window.location.search);
      if (current.page === 'about') {
        setView({ page: 'home' });
        setAboutOpen(true);
        try { window.history.replaceState({ page: 'home' }, '', '/about'); } catch (e) {}
      } else {
        navigate(current, { replace: true });
      }
    }}
    data={ageGateData}
  />
)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  var src = document.getElementById('app-src').textContent;
  var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
  (0, eval)(out);
</script>
