<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saboteur</title>
<style>
html,body{margin:0;background:#F5F4F0;min-height:100vh}
#boot{font-family:system-ui,sans-serif;color:#18181B;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
</style>
</head>
<body>
<div id="boot">Loading…</div>
<script>
(async function () {
  try {
    var n = 30;
    var parts = [];
    for (var i = 0; i < n; i++) {
      var r = await fetch('/p' + i + '.txt');
      if (!r.ok) throw new Error('chunk ' + i);
      parts.push(await r.text());
    }
    var html = atob(parts.join(''));
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('boot').textContent = 'Refresh to retry.';
    console.error(e);
  }
})();
</script>
</body>
</html>
